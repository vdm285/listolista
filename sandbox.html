<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MQTT Connectivity Test</title>
    <style>
        body { font-family: monospace; padding: 20px; max-width: 600px; margin: 0 auto; }
        h1 { font-size: 1.2rem; border-bottom: 2px solid black; padding-bottom: 10px; }
        
        textarea {
            width: 100%; height: 150px; border: 2px solid black;
            font-size: 1.2rem; padding: 10px; margin-bottom: 20px;
        }

        #status-bar { background: #eee; padding: 10px; margin-bottom: 10px; font-weight: bold; }
        #logs {
            background: #f4f4f4; border: 1px solid #ccc; height: 200px; overflow-y: scroll;
            font-size: 0.8rem; padding: 10px; white-space: pre-wrap;
        }
        .log-entry { margin-bottom: 5px; border-bottom: 1px dashed #ddd; }
        .out { color: blue; }
        .in { color: green; }
        .err { color: red; }
    </style>
    <!-- MQTT LIBRARY (Relay Strategy) -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>
    <h1>🛠 MQTT Relay Sandbox</h1>
    
    <div id="status-bar">
        Status: <span id="connection-status">🔴 Disconnected</span>
    </div>

    <textarea id="shared-text" placeholder="Connecting to public relay..."></textarea>

    <h3>Debug Log</h3>
    <div id="logs"></div>

    <script>
        // --- CONFIGURATION ---
        // We use a public, free broker. Note: Data is public!
        const BROKER_URL = 'wss://broker.hivemq.com:8884/mqtt'; 
        const TOPIC = 'listolista/sandbox/alpha_v1'; // Unique topic to avoid noise

        // --- LOGGING ---
        function log(msg, type = '') {
            const box = document.getElementById('logs');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            box.prepend(entry);
        }

        function setStatus(msg, color) {
            const el = document.getElementById('connection-status');
            el.textContent = msg;
            el.style.color = color;
        }

        // --- CORE LOGIC ---
        log(`🚀 Initializing MQTT Relay...`);
        log(`📡 Broker: ${BROKER_URL}`);
        
        const client = mqtt.connect(BROKER_URL);
        const textBox = document.getElementById('shared-text');

        // 1. ON CONNECT
        client.on('connect', () => {
            setStatus('🟢 Connected to Relay', 'green');
            log('✅ Connected! Subscribing to topic...');
            
            client.subscribe(TOPIC, (err) => {
                if (!err) {
                    log(`👂 Listening on: ${TOPIC}`);
                    // Announce presence
                    client.publish(TOPIC, JSON.stringify({ type: 'presence', msg: 'New Peer Joined' }));
                } else {
                    log(`❌ Subscribe Error: ${err}`, 'err');
                }
            });
        });

        // 2. ON MESSAGE (Receive)
        client.on('message', (topic, message) => {
            try {
                const payload = JSON.parse(message.toString());
                
                if (payload.type === 'text') {
                    // Only update if content is different (avoid loop)
                    if (textBox.value !== payload.data) {
                        log(`📥 Received Update: "${payload.data.substring(0, 10)}..."`, 'in');
                        textBox.value = payload.data;
                        textBox.style.backgroundColor = '#e0ffe0';
                        setTimeout(() => textBox.style.backgroundColor = 'white', 200);
                    }
                } else if (payload.type === 'presence') {
                    log(`👋 Peer Announcement: ${payload.msg}`, 'in');
                }
            } catch (e) {
                log(`⚠️ Parse Error: ${e.message}`, 'err');
            }
        });

        // 3. UI INPUT (Send)
        textBox.addEventListener('input', () => {
            const content = textBox.value;
            // Publish to the relay
            const payload = JSON.stringify({ type: 'text', data: content });
            client.publish(TOPIC, payload, { retain: true }); // 'retain' keeps last message for new joiners
            // log(`📤 Sent: ${content.length} chars`, 'out'); // Optional: noisy log
        });

        // 4. ERROR HANDLING
        client.on('error', (err) => {
            log(`🔥 MQTT Error: ${err}`, 'err');
            setStatus('🔴 Connection Error', 'red');
        });

        client.on('offline', () => {
            setStatus('⚫ Offline', 'gray');
            log('⚠️ Connection lost', 'err');
        });

    </script>
</body>
</html>
