<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Sync Sandbox v7</title>
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; padding: 20px; max-width: 1000px; margin: 0 auto; background: #f0f2f5; }
        
        /* HEADER & CONTROLS */
        header { 
            display: flex; flex-direction: column; gap: 15px;
            border-bottom: 3px solid #333; padding-bottom: 15px; margin-bottom: 20px;
        }
        .header-top { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        
        /* Shared Note Title */
        #shared-title {
            font-size: 1.5rem; font-weight: bold; padding: 5px; border-bottom: 2px dashed transparent;
            cursor: text; min-width: 200px; display: inline-block;
        }
        #shared-title:focus { outline: none; border-bottom-color: #333; background: #fff; }
        #shared-title:empty:before { content: "Untitled Note"; color: #999; }

        .controls { display: flex; gap: 10px; align-items: center; position: relative; }
        button {
            padding: 8px 15px; cursor: pointer; font-weight: bold;
            background: #fff; border: 2px solid #333; border-radius: 4px;
        }
        button:hover { background: #eee; }

        /* USER IDENTITY UI */
        .user-panel {
            display: flex; align-items: center; gap: 10px; font-size: 0.9rem;
            background: #e3f2fd; padding: 5px 10px; border-radius: 4px; border: 1px solid #90caf9;
        }
        #my-username {
            font-weight: bold; cursor: text; border-bottom: 1px dashed #666;
        }
        #my-username:focus { outline: none; border-bottom: 1px solid #000; }

        /* MAIN LAYOUT */
        .layout { display: grid; grid-template-columns: 250px 1fr 300px; gap: 20px; }
        @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }

        /* LEFT: PEERS & MENU */
        .panel { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .peer-item { padding: 5px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
        .peer-item.me { font-weight: bold; color: blue; }
        .status-dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; background: #ccc; margin-right: 5px; }
        .status-dot.online { background: #4caf50; box-shadow: 0 0 5px #4caf50; }

        /* Saved Rooms List */
        .room-item { 
            padding: 8px; border-bottom: 1px solid #eee; cursor: pointer; 
            display: flex; justify-content: space-between; align-items: center;
        }
        .room-item:hover { background: #f9f9f9; }
        .room-item.active { background: #e3f2fd; font-weight: bold; }
        .room-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 160px; }

        /* CENTER: INPUTS */
        .input-group { margin-bottom: 15px; position: relative; }
        label { font-size: 0.8rem; font-weight: bold; color: #666; display: flex; justify-content: space-between; }
        textarea {
            width: 100%; height: 60px; padding: 10px; border: 2px solid #ddd; border-radius: 4px;
            font-family: monospace; font-size: 1rem; transition: all 0.2s;
        }
        
        /* STATES */
        textarea:focus { border-color: #333; outline: none; }
        
        /* Orange background for remote drafting */
        textarea.remote-editing { 
            border-color: #ff9800; 
            background-color: #fff3e0 !important; /* Force orange tint */
        } 
        
        textarea.synced { border-color: #4caf50; background: #e8f5e9; } /* Green success */
        textarea.conflict { border-color: #f44336; } /* Red conflict warning */
        
        .typing-badge {
            position: absolute; right: 5px; top: -5px;
            background: #ff9800; color: white; font-size: 0.7rem; padding: 2px 6px;
            border-radius: 10px; opacity: 0; transition: opacity 0.2s;
        }
        .typing-badge.visible { opacity: 1; }

        /* RIGHT: DEBUG */
        #json-view { 
            font-family: monospace; font-size: 0.75rem; white-space: pre-wrap; 
            background: #282c34; color: #abb2bf; padding: 10px; border-radius: 4px;
            max-height: 500px; overflow-y: auto;
        }
        
        #connection-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.9); z-index: 100;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .hidden { display: none !important; }

    </style>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>

    <div id="connection-overlay">
        <h2>Connecting to Relay...</h2>
        <div id="loading-txt">Please wait</div>
    </div>

    <header>
        <div class="header-top">
            <!-- Shared Note Title -->
            <div id="shared-title" contenteditable="true" spellcheck="false">My Shared Note</div>
            
            <div class="controls">
                <button onclick="copyInvite()">🔗 Share</button>
                <button onclick="newSession()">🔄 Reset</button>
            </div>
        </div>
        
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <small id="room-display">Room: ...</small>
            
            <!-- Editable User Identity -->
            <div class="user-panel">
                <span>👤 You are:</span>
                <span id="my-username" contenteditable="true" spellcheck="false">Anonymous</span>
            </div>
        </div>
    </header>

    <div class="layout">
        
        <!-- LEFT: PEERS & MENU -->
        <div class="left-col">
            <div class="panel">
                <h3>📚 Saved Lists</h3>
                <div id="saved-rooms-list"></div>
            </div>

            <div class="panel">
                <h3>👥 Active Users</h3>
                <div id="peer-list">Waiting...</div>
            </div>
        </div>

        <!-- CENTER: BOXES -->
        <div class="panel">
            <h3>📝 Inputs</h3>
            <!-- Generated dynamically -->
            <div id="inputs-container"></div>
        </div>

        <!-- RIGHT: X-RAY -->
        <div class="panel">
            <h3>🩻 Master JSON (Server State)</h3>
            <div id="json-view">{}</div>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const BROKER = 'wss://broker.hivemq.com:8884/mqtt';
        const CHANNELS = ['Alpha', 'Beta', 'Gamma', 'Delta', 'Epsilon'];
        
        // Generate random initial ID or load from storage
        let MY_ID = localStorage.getItem('listolista_username') || 'User_' + Math.floor(Math.random() * 1000);
        
        // --- STATE MANAGEMENT ---
        // Structure: 
        // LocalState.items: { [channel]: { text, timestamp, lastAuthor, lastAuthorId } }
        // LocalState.meta: { title, timestamp, lastAuthor }
        let LocalState = { items: {}, meta: { title: "My Shared Note", timestamp: 0 } }; 
        let PeerPresences = {};
        
        // --- URL LOGIC ---
        function getRoomFromUrl() {
            const params = new URLSearchParams(window.location.search);
            let room = params.get('room');
            if (!room) {
                room = 'room_' + Date.now().toString(36);
                try {
                    const newUrl = window.location.pathname + '?room=' + room;
                    window.history.replaceState(null, null, newUrl);
                } catch (e) {
                    console.warn("Could not update URL (likely due to sandbox environment):", e);
                }
            }
            return room;
        }
        const ROOM_ID = getRoomFromUrl();
        document.getElementById('room-display').innerText = `Room: ${ROOM_ID}`;
        
        // Topics
        const T_DATA = `listolista/v6/${ROOM_ID}/data`;     // Retained Master JSON
        const T_DRAFTS = `listolista/v6/${ROOM_ID}/drafts`; // Retained Draft Status
        const T_PRESENCE = `listolista/v6/${ROOM_ID}/alive`; // Heartbeats

        // --- SAVED ROOMS LOGIC ---
        function saveCurrentRoom() {
            let rooms = JSON.parse(localStorage.getItem('listolista_rooms') || '{}');
            // Update timestamp and title
            rooms[ROOM_ID] = { 
                title: LocalState.meta.title, 
                lastVisited: Date.now() 
            };
            localStorage.setItem('listolista_rooms', JSON.stringify(rooms));
            renderSavedRooms();
        }

        function renderSavedRooms() {
            const list = document.getElementById('saved-rooms-list');
            const rooms = JSON.parse(localStorage.getItem('listolista_rooms') || '{}');
            const sortedIds = Object.keys(rooms).sort((a,b) => rooms[b].lastVisited - rooms[a].lastVisited);
            
            list.innerHTML = '';
            if(sortedIds.length === 0) list.innerHTML = '<div style="color:#999;font-style:italic;">No saved lists yet</div>';

            sortedIds.forEach(rid => {
                const r = rooms[rid];
                const div = document.createElement('div');
                div.className = `room-item ${rid === ROOM_ID ? 'active' : ''}`;
                div.innerHTML = `
                    <div class="room-name" onclick="window.location.search='?room=${rid}'">${r.title || 'Untitled'}</div>
                    <span style="font-size:0.8rem; color:#aaa;">${new Date(r.lastVisited).toLocaleDateString()}</span>
                `;
                list.appendChild(div);
            });
        }

        // --- UI BINDING: USERNAME ---
        const usernameEl = document.getElementById('my-username');
        usernameEl.innerText = MY_ID;
        usernameEl.addEventListener('blur', () => {
            const newName = usernameEl.innerText.trim();
            if(newName) {
                MY_ID = newName;
                localStorage.setItem('listolista_username', MY_ID);
                // Force presence update immediately so others see name change
                client.publish(T_PRESENCE, JSON.stringify({ id: MY_ID, ts: Date.now() }));
            }
        });
        usernameEl.addEventListener('keydown', e => { 
            if(e.key === 'Enter') { e.preventDefault(); usernameEl.blur(); } 
        });

        // --- UI BINDING: SHARED TITLE ---
        const titleEl = document.getElementById('shared-title');
        titleEl.addEventListener('input', () => {
            // Live typing for title? Or commit? Let's use commit for consistency
            titleEl.classList.add('remote-editing'); // Self-visual feedback
        });
        titleEl.addEventListener('blur', () => {
            const newVal = titleEl.innerText.trim();
            if(newVal !== LocalState.meta.title) {
                LocalState.meta = {
                    title: newVal,
                    timestamp: Date.now(),
                    lastAuthor: MY_ID
                };
                publishState();
                saveCurrentRoom(); // Update local title cache
                titleEl.classList.remove('remote-editing');
                titleEl.classList.add('synced');
                setTimeout(() => titleEl.classList.remove('synced'), 500);
            }
        });
        titleEl.addEventListener('keydown', e => { 
            if(e.key === 'Enter') { e.preventDefault(); titleEl.blur(); } 
        });

        // --- SETUP UI: BOXES ---
        const container = document.getElementById('inputs-container');
        CHANNELS.forEach(name => {
            // Init State
            LocalState.items[name] = { text: "", timestamp: 0, lastAuthor: "", lastAuthorId: "" };

            // Create DOM
            const div = document.createElement('div');
            div.className = 'input-group';
            div.innerHTML = `
                <label>
                    ${name} <span style="font-weight:normal; font-size:0.7em" id="meta-${name}"></span>
                </label>
                <div id="badge-${name}" class="typing-badge">Someone is drafting...</div>
                <textarea id="box-${name}" data-name="${name}"></textarea>
            `;
            container.appendChild(div);

            const el = document.getElementById(`box-${name}`);
            
            // 1. TYPING LOGIC (With Idle Commit - REDUCED TO 1s)
            let idleTimer = null;

            el.addEventListener('input', () => {
                // A. Signal "Drafting" (Orange State)
                publishDraftStatus(name, true);
                
                // B. Reset Idle Timer
                clearTimeout(idleTimer);
                el.classList.remove('synced');
                
                // C. Set new 1s Timer
                idleTimer = setTimeout(() => {
                    commit(name, el); // Auto-commit after 1s
                }, 1000);
            });

            // 2. COMMIT LOGIC (Manual or Auto)
            const commit = (channel, inputEl) => {
                clearTimeout(idleTimer);
                
                const newVal = inputEl.value;
                if (newVal !== LocalState.items[channel].text) {
                    LocalState.items[channel] = {
                        text: newVal,
                        timestamp: Date.now(),
                        lastAuthor: MY_ID
                    };
                    publishState();
                    
                    // Signal "Done Drafting" (Clear Orange)
                    publishDraftStatus(channel, false);
                    
                    // Visual Success
                    inputEl.classList.add('synced');
                    setTimeout(() => inputEl.classList.remove('synced'), 1000);
                }
            };

            el.addEventListener('blur', () => commit(name, el));
            el.addEventListener('keydown', e => { if(e.key==='Enter') commit(name, el); });
        });

        // --- MQTT LOGIC ---
        const client = mqtt.connect(BROKER);

        client.on('connect', () => {
            document.getElementById('connection-overlay').classList.add('hidden');
            client.subscribe([T_DATA, T_DRAFTS, T_PRESENCE]);
            
            // RESEED LOGIC: Check if server is empty but we have local data for this room
            // In a real app we'd load from a specific key per room. 
            // For sandbox, we just trust the in-memory LocalState if not overwritten.
            // (Real persistent storage per room not implemented in sandbox to keep it simple, 
            // but Menu saves the metadata)
            saveCurrentRoom();

            setInterval(() => {
                client.publish(T_PRESENCE, JSON.stringify({ id: MY_ID, ts: Date.now() }));
                cullDeadPeers();
            }, 3000);
        });

        client.on('message', (topic, msg) => {
            try {
                const payload = JSON.parse(msg.toString());

                if (topic === T_DATA) handleSync(payload);
                else if (topic === T_DRAFTS) handleDrafts(payload);
                else if (topic === T_PRESENCE) handlePresence(payload);
                
            } catch (e) { console.error(e); }
        });

        // --- 1. SMART MERGE LOGIC ---
        function handleSync(remoteState) {
            let uiUpdated = false;

            // A. Sync Title
            if (remoteState.meta && (!LocalState.meta || remoteState.meta.timestamp > LocalState.meta.timestamp)) {
                LocalState.meta = remoteState.meta;
                const tEl = document.getElementById('shared-title');
                
                // FORCE UPDATE LOGIC: Even if active, blur to prevent overwrite
                if (document.activeElement === tEl) {
                    tEl.blur(); // Force commit of whatever partial state (race condition) or just surrender
                    // Actually, if remote is newer, we should surrender.
                }
                
                tEl.innerText = remoteState.meta.title;
                saveCurrentRoom(); // Update menu cache
                uiUpdated = true;
            }

            // B. Sync Items
            if (remoteState.items) {
                Object.keys(remoteState.items).forEach(key => {
                    const localItem = LocalState.items[key];
                    const remoteItem = remoteState.items[key];

                    if (!localItem || (remoteItem.timestamp > localItem.timestamp)) {
                        LocalState.items[key] = remoteItem;
                        
                        const el = document.getElementById(`box-${key}`);
                        
                        // FORCE UPDATE LOGIC: 
                        // If user is typing in this box, and a NEWER update arrives from server...
                        if (document.activeElement === el) {
                            console.warn(`Force updating ${key} due to newer remote version.`);
                            el.blur(); // Force focus loss
                            el.classList.add('conflict'); // Visual warning
                            setTimeout(() => el.classList.remove('conflict'), 1000);
                        }

                        el.value = remoteItem.text;
                        el.style.backgroundColor = '#e3f2fd';
                        setTimeout(() => el.style.backgroundColor = 'white', 500);
                        
                        // Formatted Timestamp
                        const date = new Date(remoteItem.timestamp);
                        const dateStr = date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                        
                        const meta = document.getElementById(`meta-${key}`);
                        if(meta) meta.innerText = `Updated by ${remoteItem.lastAuthor} on ${dateStr}`;
                        uiUpdated = true;
                    }
                });
            }
            
            if (uiUpdated) updateDebugView();
        }

        function publishState() {
            client.publish(T_DATA, JSON.stringify(LocalState), { retain: true });
            updateDebugView();
        }

        // --- 2. DRAFTING INDICATOR (Orange State) ---
        function publishDraftStatus(channel, isDrafting) {
            const packet = { 
                channel: channel, 
                user: MY_ID, 
                active: isDrafting,
                ts: Date.now()
            };
            client.publish(T_DRAFTS, JSON.stringify(packet));
        }

        function handleDrafts(packet) {
            if (packet.user === MY_ID) return;

            const badge = document.getElementById(`badge-${packet.channel}`);
            const box = document.getElementById(`box-${packet.channel}`);
            
            if (badge && box) {
                if (packet.active) {
                    badge.innerText = `${packet.user} is drafting...`;
                    badge.classList.add('visible');
                    box.classList.add('remote-editing'); 
                    
                    clearTimeout(box.draftTimeout);
                    box.draftTimeout = setTimeout(() => {
                        badge.classList.remove('visible');
                        box.classList.remove('remote-editing');
                    }, 10000);
                } else {
                    badge.classList.remove('visible');
                    box.classList.remove('remote-editing');
                    clearTimeout(box.draftTimeout);
                }
            }
        }

        // --- 3. PRESENCE SYSTEM ---
        function handlePresence(packet) {
            PeerPresences[packet.id] = Date.now();
            renderPeers();
        }

        function cullDeadPeers() {
            const now = Date.now();
            Object.keys(PeerPresences).forEach(id => {
                if (now - PeerPresences[id] > 10000) delete PeerPresences[id];
            });
            renderPeers();
        }

        function renderPeers() {
            const list = document.getElementById('peer-list');
            list.innerHTML = `<div class="peer-item me"><span class="status-dot online"></span>${MY_ID} (You)</div>`;
            Object.keys(PeerPresences).forEach(id => {
                if (id !== MY_ID) list.innerHTML += `<div class="peer-item"><span class="status-dot online"></span>${id}</div>`;
            });
        }

        // --- UTILS ---
        function updateDebugView() {
            document.getElementById('json-view').innerText = JSON.stringify(LocalState, null, 2);
        }

        window.copyInvite = () => {
            navigator.clipboard.writeText(window.location.href);
            alert("Invite link copied!");
        };

        window.newSession = () => {
            if(confirm("Generate new room?")) {
                try {
                    window.location.search = '?room=room_' + Date.now();
                } catch(e) { window.location.reload(); }
            }
        };
        
        // Initial Render of saved rooms
        renderSavedRooms();

    </script>
</body>
</html>
