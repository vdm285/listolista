<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Sync Sandbox v5</title>
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; padding: 20px; max-width: 1000px; margin: 0 auto; background: #f0f2f5; }
        
        /* HEADER & CONTROLS */
        header { 
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 3px solid #333; padding-bottom: 15px; margin-bottom: 20px;
        }
        h1 { margin: 0; font-size: 1.5rem; }
        .controls { display: flex; gap: 10px; }
        button {
            padding: 8px 15px; cursor: pointer; font-weight: bold;
            background: #fff; border: 2px solid #333; border-radius: 4px;
        }
        button:hover { background: #eee; }

        /* MAIN LAYOUT */
        .layout { display: grid; grid-template-columns: 250px 1fr 300px; gap: 20px; }
        @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }

        /* LEFT: PEERS */
        .panel { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .peer-item { padding: 5px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
        .peer-item.me { font-weight: bold; color: blue; }
        .status-dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; background: #ccc; margin-right: 5px; }
        .status-dot.online { background: #4caf50; box-shadow: 0 0 5px #4caf50; }

        /* CENTER: INPUTS */
        .input-group { margin-bottom: 15px; position: relative; }
        label { font-size: 0.8rem; font-weight: bold; color: #666; display: flex; justify-content: space-between; }
        textarea {
            width: 100%; height: 60px; padding: 10px; border: 2px solid #ddd; border-radius: 4px;
            font-family: monospace; font-size: 1rem; transition: all 0.2s;
        }
        
        /* STATES */
        textarea:focus { border-color: #333; outline: none; }
        textarea.remote-editing { border-color: #ff9800; background: #fff3e0; } /* Orange warning */
        textarea.synced { border-color: #4caf50; background: #e8f5e9; } /* Green success */
        textarea.conflict { border-color: #f44336; } /* Red conflict warning */
        
        .typing-badge {
            position: absolute; right: 5px; top: -5px;
            background: #ff9800; color: white; font-size: 0.7rem; padding: 2px 6px;
            border-radius: 10px; opacity: 0; transition: opacity 0.2s;
        }
        .typing-badge.visible { opacity: 1; }

        /* RIGHT: DEBUG */
        #json-view { 
            font-family: monospace; font-size: 0.75rem; white-space: pre-wrap; 
            background: #282c34; color: #abb2bf; padding: 10px; border-radius: 4px;
            max-height: 500px; overflow-y: auto;
        }
        
        #connection-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.9); z-index: 100;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .hidden { display: none !important; }

    </style>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>

    <div id="connection-overlay">
        <h2>Connecting to Relay...</h2>
        <div id="loading-txt">Please wait</div>
    </div>

    <header>
        <div>
            <h1>🛠 Smart Sync v5</h1>
            <small id="room-display">Room: ...</small>
        </div>
        <div class="controls">
            <button onclick="copyInvite()">🔗 Share</button>
            <button onclick="newSession()">🔄 Reset</button>
        </div>
    </header>

    <div class="layout">
        
        <!-- LEFT: PRESENCE -->
        <div class="panel">
            <h3>👥 Active Users</h3>
            <div id="peer-list">Waiting...</div>
        </div>

        <!-- CENTER: BOXES -->
        <div class="panel">
            <h3>📝 Inputs</h3>
            <!-- Generated dynamically -->
            <div id="inputs-container"></div>
        </div>

        <!-- RIGHT: X-RAY -->
        <div class="panel">
            <h3>🩻 Master JSON (Server State)</h3>
            <div id="json-view">{}</div>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const BROKER = 'wss://broker.hivemq.com:8884/mqtt';
        const CHANNELS = ['Alpha', 'Beta', 'Gamma', 'Delta', 'Epsilon'];
        const MY_ID = 'User_' + Math.floor(Math.random() * 1000);
        
        // --- STATE MANAGEMENT ---
        let LocalState = {}; 
        let PeerPresences = {};
        let Drafts = {}; // Tracks who is drafting what: { [channel]: { user: string, ts: number } }

        // --- URL LOGIC ---
        function getRoomFromUrl() {
            const params = new URLSearchParams(window.location.search);
            let room = params.get('room');
            if (!room) {
                room = 'room_' + Date.now().toString(36);
                try {
                    const newUrl = window.location.pathname + '?room=' + room;
                    window.history.replaceState(null, null, newUrl);
                } catch (e) {
                    console.warn("Could not update URL (likely due to sandbox environment):", e);
                }
            }
            return room;
        }
        const ROOM_ID = getRoomFromUrl();
        document.getElementById('room-display').innerText = `Room: ${ROOM_ID}`;
        
        // Topics
        const T_DATA = `listolista/v5/${ROOM_ID}/data`;     // Retained Master JSON
        const T_DRAFTS = `listolista/v5/${ROOM_ID}/drafts`; // Retained Draft Status
        const T_PRESENCE = `listolista/v5/${ROOM_ID}/alive`; // Heartbeats

        // --- SETUP UI ---
        const container = document.getElementById('inputs-container');
        CHANNELS.forEach(name => {
            // Init State
            LocalState[name] = { text: "", timestamp: 0, lastAuthor: "" };

            // Create DOM
            const div = document.createElement('div');
            div.className = 'input-group';
            div.innerHTML = `
                <label>
                    ${name} <span style="font-weight:normal; font-size:0.7em" id="meta-${name}"></span>
                </label>
                <div id="badge-${name}" class="typing-badge">Someone is drafting...</div>
                <textarea id="box-${name}" data-name="${name}"></textarea>
            `;
            container.appendChild(div);

            const el = document.getElementById(`box-${name}`);
            
            // 1. TYPING LOGIC (With Idle Commit)
            let idleTimer = null;

            el.addEventListener('input', () => {
                // A. Signal "Drafting" (Orange State)
                publishDraftStatus(name, true);
                
                // B. Reset Idle Timer
                clearTimeout(idleTimer);
                el.classList.remove('synced');
                
                // C. Set new 5s Timer
                idleTimer = setTimeout(() => {
                    commit(name, el); // Auto-commit after 5s
                }, 5000);
            });

            // 2. COMMIT LOGIC (Manual or Auto)
            const commit = (channel, inputEl) => {
                clearTimeout(idleTimer);
                
                const newVal = inputEl.value;
                if (newVal !== LocalState[channel].text) {
                    LocalState[channel] = {
                        text: newVal,
                        timestamp: Date.now(),
                        lastAuthor: MY_ID
                    };
                    publishState();
                    
                    // Signal "Done Drafting" (Clear Orange)
                    publishDraftStatus(channel, false);
                    
                    // Visual Success
                    inputEl.classList.add('synced');
                    setTimeout(() => inputEl.classList.remove('synced'), 1000);
                }
            };

            el.addEventListener('blur', () => commit(name, el));
            el.addEventListener('keydown', e => { if(e.key==='Enter') commit(name, el); });
        });

        // --- MQTT LOGIC ---
        const client = mqtt.connect(BROKER);

        client.on('connect', () => {
            document.getElementById('connection-overlay').classList.add('hidden');
            client.subscribe([T_DATA, T_DRAFTS, T_PRESENCE]);
            
            setInterval(() => {
                client.publish(T_PRESENCE, JSON.stringify({ id: MY_ID, ts: Date.now() }));
                cullDeadPeers();
            }, 3000);
        });

        client.on('message', (topic, msg) => {
            try {
                const payload = JSON.parse(msg.toString());

                if (topic === T_DATA) handleSync(payload);
                else if (topic === T_DRAFTS) handleDrafts(payload);
                else if (topic === T_PRESENCE) handlePresence(payload);
                
            } catch (e) { console.error(e); }
        });

        // --- 1. SMART MERGE LOGIC ---
        function handleSync(remoteState) {
            let uiUpdated = false;
            Object.keys(remoteState).forEach(key => {
                const localItem = LocalState[key];
                const remoteItem = remoteState[key];

                if (!localItem || (remoteItem.timestamp > localItem.timestamp)) {
                    LocalState[key] = remoteItem;
                    
                    const el = document.getElementById(`box-${key}`);
                    // Only overwrite if user is NOT currently typing
                    if (document.activeElement !== el) {
                        el.value = remoteItem.text;
                        el.style.backgroundColor = '#e3f2fd';
                        setTimeout(() => el.style.backgroundColor = 'white', 500);
                    }
                    
                    const meta = document.getElementById(`meta-${key}`);
                    if(meta) meta.innerText = `Updated by ${remoteItem.lastAuthor}`;
                    uiUpdated = true;
                }
            });
            if (uiUpdated) updateDebugView();
        }

        function publishState() {
            client.publish(T_DATA, JSON.stringify(LocalState), { retain: true });
            updateDebugView();
        }

        // --- 2. DRAFTING INDICATOR (Orange State) ---
        function publishDraftStatus(channel, isDrafting) {
            // We use a separate retained topic for drafts so new users see who is currently busy
            // Packet: { [channel]: { user: "User_123", active: true/false } }
            // Note: In a real app we'd merge this better, for sandbox we just broadcast the single change
            const packet = { 
                channel: channel, 
                user: MY_ID, 
                active: isDrafting,
                ts: Date.now()
            };
            client.publish(T_DRAFTS, JSON.stringify(packet)); // No retain for drafts to prevent ghosts? 
            // Actually, we WANT retain if we want to see status on load. But we need to handle clearing.
            // Let's use ephemeral messaging for simplicity here to avoid "stuck" orange states.
        }

        function handleDrafts(packet) {
            if (packet.user === MY_ID) return;

            const badge = document.getElementById(`badge-${packet.channel}`);
            const box = document.getElementById(`box-${packet.channel}`);
            
            if (badge && box) {
                if (packet.active) {
                    badge.innerText = `${packet.user} is drafting...`;
                    badge.classList.add('visible');
                    box.classList.add('remote-editing');
                    
                    // Safety timeout: If no "done" signal received in 10s, clear it
                    clearTimeout(box.draftTimeout);
                    box.draftTimeout = setTimeout(() => {
                        badge.classList.remove('visible');
                        box.classList.remove('remote-editing');
                    }, 10000);
                } else {
                    badge.classList.remove('visible');
                    box.classList.remove('remote-editing');
                    clearTimeout(box.draftTimeout);
                }
            }
        }

        // --- 3. PRESENCE SYSTEM ---
        function handlePresence(packet) {
            PeerPresences[packet.id] = Date.now();
            renderPeers();
        }

        function cullDeadPeers() {
            const now = Date.now();
            Object.keys(PeerPresences).forEach(id => {
                if (now - PeerPresences[id] > 10000) delete PeerPresences[id];
            });
            renderPeers();
        }

        function renderPeers() {
            const list = document.getElementById('peer-list');
            list.innerHTML = `<div class="peer-item me"><span class="status-dot online"></span>${MY_ID} (You)</div>`;
            Object.keys(PeerPresences).forEach(id => {
                if (id !== MY_ID) list.innerHTML += `<div class="peer-item"><span class="status-dot online"></span>${id}</div>`;
            });
        }

        // --- UTILS ---
        function updateDebugView() {
            document.getElementById('json-view').innerText = JSON.stringify(LocalState, null, 2);
        }

        window.copyInvite = () => {
            navigator.clipboard.writeText(window.location.href);
            alert("Invite link copied!");
        };

        window.newSession = () => {
            if(confirm("Generate new room?")) {
                try {
                    window.location.search = '?room=room_' + Date.now();
                } catch(e) { window.location.reload(); }
            }
        };

    </script>
</body>
</html>
