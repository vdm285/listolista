<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MQTT Multi-Box Sync</title>
    <style>
        body { font-family: monospace; padding: 20px; max-width: 600px; margin: 0 auto; }
        h1 { font-size: 1.2rem; border-bottom: 2px solid black; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        
        .box-container { margin-bottom: 20px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        textarea {
            width: 100%; height: 80px; border: 2px solid black;
            font-size: 1.2rem; padding: 10px;
        }

        #status-bar { 
            background: #eee; padding: 10px; margin-bottom: 20px; border: 1px solid #ccc;
        }
        
        /* New Controls */
        .control-panel { margin-top: 10px; display: flex; gap: 10px; }
        button {
            padding: 8px 12px; font-family: inherit; font-weight: bold;
            cursor: pointer; border: 2px solid black; background: white;
        }
        button:hover { background: #eee; }
        button:active { transform: translateY(1px); }

        #logs {
            background: #f4f4f4; border: 1px solid #ccc; height: 150px; overflow-y: scroll;
            font-size: 0.8rem; padding: 10px; white-space: pre-wrap;
        }
        .log-entry { margin-bottom: 5px; border-bottom: 1px dashed #ddd; }
        .in { color: green; } .err { color: red; }
    </style>
    <!-- MQTT LIBRARY -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>
    <h1>
        <span>🛠 Sync Sandbox</span>
        <small style="font-size: 0.8rem; font-weight: normal;">v2.0</small>
    </h1>
    
    <div id="status-bar">
        <div><strong>Room ID:</strong> <span id="room-id">...</span></div>
        <div style="margin-top:5px;"><strong>Status:</strong> <span id="connection-status">🔴 Disconnected</span></div>
        
        <div class="control-panel">
            <button id="btn-copy">🔗 Copy Invite Link</button>
            <button id="btn-new">🔄 New Room</button>
        </div>
    </div>

    <!-- BOX A -->
    <div class="box-container">
        <label>CHANNEL A</label>
        <textarea id="box-a" data-channel="A" placeholder="Type in A..."></textarea>
    </div>

    <!-- BOX B -->
    <div class="box-container">
        <label>CHANNEL B</label>
        <textarea id="box-b" data-channel="B" placeholder="Type in B..."></textarea>
    </div>

    <h3>Debug Log</h3>
    <div id="logs"></div>

    <script>
        // --- CONFIGURATION ---
        const BROKER_URL = 'wss://broker.hivemq.com:8884/mqtt'; 
        
        // 1. GET OR GENERATE ROOM ID
        function getRoomId() {
            let hash = window.location.hash.replace('#', '');
            if (!hash) {
                // Generate a robust ID
                hash = 'sandbox_' + Date.now().toString(36);
                window.history.replaceState(null, null, '#' + hash);
            }
            return hash;
        }

        const SESSION_ID = getRoomId();
        const TOPIC = `listolista/sandbox/${SESSION_ID}`;

        // Display Room ID
        document.getElementById('room-id').innerText = SESSION_ID;

        // --- CONTROLS LOGIC ---
        document.getElementById('btn-copy').onclick = () => {
            const url = window.location.href;
            navigator.clipboard.writeText(url).then(() => {
                alert('Invite Link Copied! Send this URL to your partner.');
            });
        };

        document.getElementById('btn-new').onclick = () => {
            if(confirm("Start a new disconnected session?")) {
                // Clear hash and reload to generate new ID
                window.location.hash = '';
                window.location.reload();
            }
        };

        // --- LOGGING ---
        function log(msg, type = '') {
            const box = document.getElementById('logs');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            box.prepend(entry);
        }

        function setStatus(msg, color) {
            const el = document.getElementById('connection-status');
            el.textContent = msg;
            el.style.color = color;
        }

        // --- MQTT CORE ---
        log(`🚀 Initializing...`);
        
        const client = mqtt.connect(BROKER_URL);
        const boxes = document.querySelectorAll('textarea');

        // 2. CONNECT
        client.on('connect', () => {
            setStatus('🟢 Connected', 'green');
            client.subscribe(TOPIC);
            // Announce presence
            const userId = 'User-' + Math.floor(Math.random()*100);
            client.publish(TOPIC, JSON.stringify({ type: 'presence', id: userId }));
        });

        // 3. RECEIVE
        client.on('message', (topic, message) => {
            try {
                const payload = JSON.parse(message.toString());
                
                if (payload.type === 'update') {
                    const targetBox = document.getElementById(payload.elementId);
                    if (targetBox && targetBox.value !== payload.data) {
                        log(`📥 Update for ${payload.channel}`, 'in');
                        targetBox.value = payload.data;
                        targetBox.style.borderColor = 'green';
                        setTimeout(() => targetBox.style.borderColor = 'black', 300);
                    }
                } else if (payload.type === 'presence') {
                    log(`👋 Peer Joined: ${payload.id}`, 'in');
                }
            } catch (e) { log(`⚠️ Error: ${e.message}`, 'err'); }
        });

        // 4. SEND
        boxes.forEach(box => {
            box.addEventListener('input', () => {
                const packet = {
                    type: 'update',
                    elementId: box.id,      
                    channel: box.dataset.channel, 
                    data: box.value
                };
                client.publish(TOPIC, JSON.stringify(packet), { retain: true });
            });
        });

        client.on('error', (err) => {
            log(`🔥 MQTT Error: ${err}`, 'err');
            setStatus('🔴 Connection Error', 'red');
        });

    </script>
</body>
</html>
