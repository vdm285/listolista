<script>
  // iPhone: no start_url, so a home-screen icon opens the list it was added from (its storage is separate).
  // Android: start_url "./" (the icon opens the last list; the secret in the link never goes into the manifest).
  (function () {
    var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var l = document.createElement('link'); l.rel = 'manifest';
    l.href = ios ? 'manifest.webmanifest' : 'manifest-android.webmanifest';
    document.head.appendChild(l);
  })();
</script>
