<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ListoLista</title>
    <style>
        /* [SISTEMA DE DISEÑO: UTILIDAD PRAGMÁTICA] */
        :root {
            --h-header: 50px;
            --h-item: 55px;
            --color-text: #000;
            --color-bg: #fff;
            --color-dim: #eee;
            --font-stack: system-ui, -apple-system, sans-serif;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body, html {
            margin: 0; padding: 0;
            height: 100%; width: 100%;
            font-family: var(--font-stack);
            background: var(--color-bg);
            color: var(--color-text);
            overflow: hidden; 
        }

        /* --- ENCABEZADO FIJO --- */
        header {
            height: var(--h-header);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 1rem;
            border-bottom: 2px solid var(--color-text);
            position: fixed;
            top: 0; left: 0; right: 0;
            background: var(--color-bg);
            z-index: 10;
        }

        /* TÍTULO EDITABLE */
        #title-container {
            flex-grow: 1;
            margin-right: 10px;
        }
        #title { 
            font-weight: bold; 
            font-size: 0.9rem; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            padding: 5px;
            border-bottom: 1px dashed transparent;
            display: inline-block;
        }
        #title:focus {
            outline: none;
            border-bottom: 1px dashed var(--color-text);
            background: #f9f9f9;
        }

        /* ACCIONES DEL ENCABEZADO */
        .actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .icon-btn {
            cursor: pointer;
            font-size: 1.2rem;
            line-height: 1;
            user-select: none;
        }
        .icon-btn:hover { opacity: 0.7; }
        .icon-btn:active { transform: scale(0.95); }

        /* --- ÁREA DE VISUALIZACIÓN --- */
        main {
            position: absolute;
            top: var(--h-header);
            bottom: 0;
            left: 0; right: 0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        /* --- FLUJO DE ENTRADA --- */
        .slot {
            min-height: var(--h-item);
            border-bottom: 1px solid var(--color-dim);
            display: flex;
            align-items: center;
            padding: 0 1rem;
        }

        .slot input {
            width: 100%; height: 100%; border: none;
            font-size: 1.1rem; font-family: inherit; outline: none; background: transparent;
        }

        /* --- ÍTEMS DE LA LISTA --- */
        .row {
            min-height: var(--h-item);
            border-bottom: 1px solid var(--color-dim);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1rem;
            cursor: pointer;
            user-select: none;
            transition: background 0.1s;
        }

        .txt { flex-grow: 1; font-size: 1.1rem; padding: 12px 0; }
        
        .del {
            padding: 10px 0 10px 20px;
            color: var(--color-text);
            font-weight: bold;
            font-size: 1.4rem;
        }

        /* ESTADO: COMPLETADO */
        .done { background-color: #fcfcfc; color: #aaa; }
        .done .txt { text-decoration: line-through; }

        /* --- MODAL DE MENÚ --- */
        #modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            z-index: 50;
            display: flex; justify-content: center; align-items: center;
            backdrop-filter: blur(2px);
        }
        
        .hidden { display: none !important; }

        #modal-box {
            background: var(--color-bg);
            width: 80%;
            max-width: 300px;
            border: 2px solid var(--color-text);
            padding: 1.5rem;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.2);
        }

        .menu-opt {
            padding: 10px 0;
            border-bottom: 1px dashed var(--color-dim);
            font-size: 1rem;
            color: #555;
            cursor: pointer;
        }
        .menu-opt:last-child { border-bottom: none; }
        .menu-opt:hover { color: #000; }
        
        /* INPUT DE ARCHIVO OCULTO */
        #file-input { display: none; }

        /* NOTIFICACIÓN TOAST */
        #toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: #000; color: #fff; padding: 10px 20px; border-radius: 4px;
            font-size: 0.9rem; opacity: 0; transition: opacity 0.3s; pointer-events: none;
            white-space: nowrap;
        }
        #toast.show { opacity: 1; }
    </style>
    <!-- TRYSTERO: The P2P Magic Library (7kB) -->
    <script type="module">
        import { joinRoom } from 'https://cdn.jsdelivr.net/npm/trystero@0.19.0/dist/trystero-torrent.min.js';
        window.joinRoom = joinRoom; 
    </script>
</head>
<body>

    <header>
        <div id="title-container">
            <div id="title" contenteditable="true" spellcheck="false">MI LISTA</div>
        </div>
        <div class="actions">
            <!-- Íconos: Guardar, Abrir, Compartir, Menú -->
            <div class="icon-btn" id="btn-sync" title="Estado de Sync">📡</div>
            <div class="icon-btn" id="btn-save" title="Guardar archivo">💾</div>
            <div class="icon-btn" id="btn-open" title="Abrir archivo">📂</div>
            <div class="icon-btn" id="btn-share" title="Copiar lista">🔗</div>
            <div class="icon-btn" id="btn-menu" title="Menú">☰</div>
        </div>
    </header>

    <main id="viewport">
        <!-- Flujo de Entrada -->
        <div class="slot"><input id="i1" placeholder="Escribe aquí..." autocomplete="off"></div>
        <div class="slot"><input id="i2" placeholder="Escribe aquí..." autocomplete="off"></div>
        
        <div id="pending-box"></div>
        <div id="completed-box"></div>
    </main>

    <!-- MODAL DE MENÚ -->
    <div id="modal-overlay" class="hidden">
        <div id="modal-box">
            <h3 style="margin-top:0; text-transform:uppercase; font-size:0.9rem;">Opciones</h3>
            <div class="menu-opt" id="opt-clear">Limpiar completados</div>
            <div class="menu-opt" id="opt-wipe">Borrar todo</div>
            <div class="menu-opt" style="font-weight:bold; margin-top:10px;" id="close-btn">Cerrar</div>
        </div>
    </div>

    <!-- Elementos Ocultos -->
    <input type="file" id="file-input" accept=".json">
    <div id="toast">¡Copiado al portapapeles!</div>

    <script>
        const App = {
            state: { 
                title: "MI LISTA",
                items: [] 
            },
            config: { storageKey: 'listolista_v1' },
            broadcast: null, // P2P Sender

            init() {
                this.cacheDOM();
                this.load(); // Cargar desde LocalStorage
                this.bind();
                this.render();
                this.dom.i1.focus();
                
                // Initialize P2P after a short delay to allow modules to load
                setTimeout(() => this.initSync(), 500);
            },

            cacheDOM() {
                this.dom = {
                    title: document.getElementById('title'),
                    i1: document.getElementById('i1'),
                    i2: document.getElementById('i2'),
                    pBox: document.getElementById('pending-box'),
                    cBox: document.getElementById('completed-box'),
                    // Acciones
                    btnSave: document.getElementById('btn-save'),
                    btnOpen: document.getElementById('btn-open'),
                    btnShare: document.getElementById('btn-share'),
                    btnMenu: document.getElementById('btn-menu'),
                    btnSync: document.getElementById('btn-sync'), // New Sync Icon
                    fileInput: document.getElementById('file-input'),
                    // Modal
                    modal: document.getElementById('modal-overlay'),
                    closeBtn: document.getElementById('close-btn'),
                    optClear: document.getElementById('opt-clear'),
                    optWipe: document.getElementById('opt-wipe'),
                    toast: document.getElementById('toast')
                };
            },

            bind() {
                // 1. Flujo de Entrada
                [this.dom.i1, this.dom.i2].forEach(input => {
                    input.onkeydown = e => { if (e.key === 'Enter') this.add(input); };
                    input.onblur = () => { setTimeout(() => this.add(input), 150); };
                });

                // 2. Edición de Título
                this.dom.title.oninput = () => {
                    this.state.title = this.dom.title.innerText;
                    this.save();
                };
                // Prevenir Enter en el título
                this.dom.title.onkeydown = (e) => {
                    if (e.key === 'Enter') { e.preventDefault(); this.dom.title.blur(); }
                };

                // 3. Acciones del Encabezado
                this.dom.btnSave.onclick = () => this.actionExport();
                this.dom.btnOpen.onclick = () => this.dom.fileInput.click();
                this.dom.btnShare.onclick = () => this.actionShare();
                
                // Cambio en Input de Archivo (Abrir)
                this.dom.fileInput.onchange = (e) => this.actionImport(e);

                // 4. Menú y Modal
                this.dom.btnMenu.onclick = () => this.dom.modal.classList.remove('hidden');
                this.dom.closeBtn.onclick = () => this.dom.modal.classList.add('hidden');
                this.dom.modal.onclick = (e) => {
                    if (e.target === this.dom.modal) this.dom.modal.classList.add('hidden');
                };
                
                // Opciones del Menú
                this.dom.optClear.onclick = () => {
                    this.state.items = this.state.items.filter(i => !i.done);
                    this.save(); this.render(); this.dom.modal.classList.add('hidden');
                };
                this.dom.optWipe.onclick = () => {
                    if(confirm("¿Estás seguro de borrar todo?")) {
                        this.state.items = []; 
                        this.save(); this.render(); 
                        this.dom.modal.classList.add('hidden');
                    }
                };
                
                // Sync Info Click
                this.dom.btnSync.onclick = () => {
                    const roomId = window.location.hash.replace('#', '');
                    prompt("Tu ID de Sala (Comparte esto en la URL):", roomId);
                };
            },

            // --- CAPA DE SINCRONIZACIÓN (P2P) ---
            initSync() {
                // 1. Get Room ID from URL hash or generate new
                let roomId = window.location.hash.replace('#', '');
                if (!roomId) {
                    roomId = Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
                    window.history.replaceState(null, null, '#' + roomId);
                }
                console.log("📡 Uniéndose a la sala:", roomId);

                // 2. Connect via BitTorrent Trackers
                try {
                    // 'listolista_soul' is the "App ID" namespace
                    const config = { appId: 'listolista_soul_v1' };
                    const room = window.joinRoom(config, roomId);
                    
                    // 3. Create Data Channel
                    const [sendUpdate, getUpdate] = room.makeAction('sync');
                    this.broadcast = sendUpdate; 

                    // 4. Listen for updates
                    getUpdate((remoteState) => {
                        console.log("📥 Recibido estado remoto");
                        this.mergeState(remoteState);
                    });

                    // 5. Peer Join Event
                    room.onPeerJoin(peerId => {
                        console.log("👋 Nuevo peer conectado:", peerId);
                        this.showToast("👋 ¡Un colaborador se ha unido!");
                        // Send them our current state immediately so they catch up
                        this.broadcast(this.state);
                    });
                    
                    this.dom.btnSync.style.opacity = "1"; // Visual indicator active

                } catch (e) {
                    console.warn("Módulo P2P cargando o falló:", e);
                    this.dom.btnSync.style.opacity = "0.3";
                }
            },

            mergeState(remoteState) {
                // Simple Merge Strategy: Union by ID + Last Write Wins on Title
                let hasChanges = false;
                const localMap = new Map(this.state.items.map(i => [i.id, i]));

                // Update Title if remote is different (rudimentary conflict res)
                if (remoteState.title && remoteState.title !== this.state.title) {
                    this.state.title = remoteState.title;
                    this.dom.title.innerText = this.state.title;
                    hasChanges = true;
                }

                remoteState.items.forEach(rItem => {
                    const lItem = localMap.get(rItem.id);
                    
                    // If item is new OR remote version is technically "newer" (in V1 we just trust remote for add/toggle)
                    // For robust sync we'd compare timestamps, but for "Soul V1" union is safer
                    if (!lItem) {
                        localMap.set(rItem.id, rItem);
                        hasChanges = true;
                    } else {
                        // If remote toggled it differently
                        if (rItem.done !== lItem.done || rItem.txt !== lItem.txt) {
                            // In a real CRDT we compare clocks. Here we let remote win to ensure propagation.
                            localMap.set(rItem.id, rItem);
                            hasChanges = true;
                        }
                    }
                });

                if (hasChanges) {
                    this.state.items = Array.from(localMap.values());
                    this.save(true); // Save but don't broadcast back to avoid loop
                    this.render();
                    this.showToast("🔄 Lista actualizada remotamente");
                }
            },

            // --- CAPA DE PERSISTENCIA ---
            load() {
                const data = localStorage.getItem(this.config.storageKey);
                if (data) {
                    try {
                        const parsed = JSON.parse(data);
                        if (parsed.items) {
                            this.state = parsed;
                        } else {
                            this.state.items = parsed;
                        }
                    } catch (e) { console.error('Corrupción de datos', e); }
                }
                this.dom.title.innerText = this.state.title || "MI LISTA";
            },

            save(skipBroadcast = false) {
                localStorage.setItem(this.config.storageKey, JSON.stringify(this.state));
                
                // Broadcast changes to P2P mesh
                if (!skipBroadcast && this.broadcast) {
                    this.broadcast(this.state);
                }
            },

            // --- LÓGICA PRINCIPAL ---
            add(el) {
                const val = el.value.trim();
                if (!val) return;

                this.state.items.push({
                    id: Date.now(),
                    txt: val,
                    done: false,
                    ts: Date.now(),
                    dt: null
                });

                el.value = '';
                el.focus();
                this.save();
                this.render();
            },

            toggle(id) {
                const item = this.state.items.find(i => i.id === id);
                if (item) {
                    item.done = !item.done;
                    item.dt = item.done ? Date.now() : null;
                    this.save();
                    this.render();
                }
            },

            remove(id, e) {
                e.stopPropagation();
                this.state.items = this.state.items.filter(i => i.id !== id);
                this.save();
                this.render();
            },

            // --- ACCIONES (Guardar/Abrir/Compartir) ---
            
            actionExport() {
                const dataStr = JSON.stringify(this.state, null, 2);
                const blob = new Blob([dataStr], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = url;
                const safeTitle = this.state.title.replace(/[^a-z0-9]/gi, '_').toLowerCase();
                a.download = `${safeTitle}_backup.json`;
                a.click();
                URL.revokeObjectURL(url);
                this.showToast("Lista guardada en Descargas");
            },

            actionImport(e) {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const parsed = JSON.parse(event.target.result);
                        if (parsed.items && Array.isArray(parsed.items)) {
                            this.state = parsed;
                            this.save();
                            this.render();
                            this.dom.title.innerText = this.state.title;
                            this.showToast("Lista cargada correctamente");
                        } else {
                            alert("Formato de archivo inválido");
                        }
                    } catch (err) {
                        alert("Error al leer archivo");
                    }
                };
                reader.readAsText(file);
                e.target.value = '';
            },

            actionShare() {
                // Now copies the URL with the Room ID hash!
                const url = window.location.href;
                navigator.clipboard.writeText(url).then(() => {
                    this.showToast("¡Enlace de sala copiado!");
                });
            },

            showToast(msg) {
                this.dom.toast.textContent = msg;
                this.dom.toast.classList.add('show');
                setTimeout(() => this.dom.toast.classList.remove('show'), 2000);
            },

            render() {
                this.dom.pBox.innerHTML = '';
                this.dom.cBox.innerHTML = '';

                const pending = this.state.items.filter(i => !i.done).sort((a,b) => a.ts - b.ts);
                const completed = this.state.items.filter(i => i.done).sort((a,b) => b.dt - a.dt);

                pending.forEach(i => this.dom.pBox.appendChild(this.row(i)));
                completed.forEach(i => this.dom.cBox.appendChild(this.row(i)));
            },

            row(item) {
                const div = document.createElement('div');
                div.className = `row ${item.done ? 'done' : ''}`;
                div.onclick = () => this.toggle(item.id);

                const txt = document.createElement('div');
                txt.className = 'txt';
                txt.textContent = item.txt;

                const del = document.createElement('div');
                del.className = 'del';
                del.innerHTML = '&times;';
                del.onclick = (e) => this.remove(item.id, e);

                div.append(txt, del);
                return div;
            }
        };

        App.init();
    </script>
</body>
</html>
