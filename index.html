<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ListoLista</title>
    <style>
        /* [SISTEMA DE DISEÑO: UTILIDAD PRAGMÁTICA] */
        :root {
            --h-header: 50px;
            --h-item: 55px;
            --color-text: #000;
            --color-bg: #fff;
            --color-dim: #eee;
            --font-stack: system-ui, -apple-system, sans-serif;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body, html {
            margin: 0; padding: 0;
            height: 100%; width: 100%;
            font-family: var(--font-stack);
            background: var(--color-bg);
            color: var(--color-text);
            overflow: hidden; 
        }

        /* --- ENCABEZADO FIJO --- */
        header {
            height: var(--h-header);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 1rem;
            border-bottom: 2px solid var(--color-text);
            position: fixed;
            top: 0; left: 0; right: 0;
            background: var(--color-bg);
            z-index: 10;
        }

        /* TÍTULO EDITABLE */
        #title-container { flex-grow: 1; margin-right: 10px; overflow: hidden; }
        #title { 
            font-weight: bold; font-size: 0.9rem; text-transform: uppercase; 
            letter-spacing: 1px; padding: 5px; 
            border-bottom: 1px dashed transparent; display: inline-block;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
        }
        #title:focus { outline: none; border-bottom: 1px dashed var(--color-text); background: #f9f9f9; }

        /* ACCIONES DEL ENCABEZADO */
        .actions { display: flex; align-items: center; gap: 15px; }
        .icon-btn { cursor: pointer; font-size: 1.2rem; line-height: 1; user-select: none; position: relative; }
        .icon-btn:hover { opacity: 0.7; }
        .icon-btn:active { transform: scale(0.95); }
        
        /* SORT INDICATOR */
        .sort-badge { 
            position: absolute; bottom: -2px; right: -2px; 
            font-size: 0.6rem; font-weight: bold; background: #eee; 
            padding: 0 2px; border-radius: 3px; 
        }

        /* --- ÁREA DE VISUALIZACIÓN --- */
        main {
            position: absolute; top: var(--h-header); bottom: 0; left: 0; right: 0;
            overflow-y: auto; display: flex; flex-direction: column;
        }

        /* --- FLUJO DE ENTRADA --- */
        .slot {
            min-height: var(--h-item); border-bottom: 1px solid var(--color-dim);
            display: flex; align-items: center; padding: 0 1rem;
        }
        .slot input {
            width: 100%; height: 100%; border: none; font-size: 1.1rem; 
            font-family: inherit; outline: none; background: transparent;
        }

        /* --- ÍTEMS DE LA LISTA --- */
        .row {
            min-height: var(--h-item); border-bottom: 1px solid var(--color-dim);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 1rem; cursor: pointer; user-select: none; transition: background 0.2s;
        }
        
        .item-content { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; padding: 8px 0; pointer-events: none; }
        .txt { font-size: 1.1rem; line-height: 1.2; }
        .cat-tag { font-size: 0.75rem; color: #666; margin-top: 2px; }
        
        .del {
            padding: 10px 0 10px 20px; color: var(--color-text);
            font-weight: bold; font-size: 1.4rem;
        }

        /* SECTION HEADERS (For Aisle Sort) */
        .aisle-header {
            background: #f0f0f0; padding: 5px 1rem; font-size: 0.8rem; 
            font-weight: bold; color: #555; text-transform: uppercase;
            border-bottom: 1px solid #ddd;
        }

        /* ESTADOS DE ÍTEM */
        .done { background-color: #fcfcfc; color: #aaa; }
        .done .txt { text-decoration: line-through; }
        
        .synced { background-color: #e8f5e9 !important; transition: background 0.5s; }

        /* --- MODALES --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4); z-index: 50;
            display: flex; justify-content: center; align-items: center;
            backdrop-filter: blur(2px);
        }
        .hidden { display: none !important; }

        .modal-box {
            background: var(--color-bg); width: 90%; max-width: 360px;
            border: 2px solid var(--color-text); padding: 1.5rem;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.2);
            max-height: 80vh; overflow-y: auto;
            position: relative;
        }

        .menu-opt {
            padding: 10px 0; border-bottom: 1px dashed var(--color-dim);
            font-size: 1rem; color: #555; cursor: pointer;
            display: flex; justify-content: space-between; align-items: center;
        }
        .menu-opt:hover { color: #000; }
        .menu-header { margin-top:0; text-transform:uppercase; font-size:0.9rem; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 10px; }

        /* Close X Button */
        .close-x {
            position: absolute; top: 10px; right: 15px;
            font-size: 1.2rem; cursor: pointer; color: #888;
            font-weight: bold; line-height: 1;
        }
        .close-x:hover { color: #000; }

        /* User List Styles */
        .user-row { padding: 5px 0; font-size: 0.9rem; display: flex; align-items: center; gap: 8px; }
        .dot { width: 8px; height: 8px; background: #4caf50; border-radius: 50%; }
        
        /* Saved Rooms Styles */
        .lib-columns { display: flex; gap: 15px; }
        .lib-col { flex: 1; }
        .lib-col h4 { font-size: 0.8rem; text-transform: uppercase; color: #888; border-bottom: 1px solid #eee; margin-bottom: 5px; }
        
        .saved-room { padding: 8px 0; border-bottom: 1px solid #eee; cursor: pointer; }
        .saved-room strong { display: block; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .saved-room span { font-size: 0.7rem; color: #aaa; display: block; }
        .room-id-display { font-family: monospace; font-size: 0.65rem; color: #888; margin-top: 2px; }
        .saved-room:hover { background: #f9f9f9; }
        .active-room { background: #e3f2fd; }

        #toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: #000; color: #fff; padding: 10px 20px; border-radius: 4px;
            font-size: 0.9rem; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 100;
        }
        #toast.show { opacity: 1; }
        
        /* Connection Status */
        #conn-dot { width: 8px; height: 8px; border-radius: 50%; background: #ccc; position: absolute; top: 12px; right: 12px; border: 1px solid white; }
        #conn-dot.green { background: #4caf50; }
        #conn-dot.orange { background: #ff9800; } 

        #connect-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.95); z-index: 200;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            font-size: 1.2rem; font-weight: bold; color: #555;
        }
        .spinner { font-size: 2rem; animation: spin 1s infinite linear; margin-bottom: 15px; }
        @keyframes spin { from {transform:rotate(0deg);} to {transform:rotate(360deg);} }

        .manual-join { margin-top: 15px; padding-top: 15px; border-top: 1px dashed #ccc; display: flex; gap: 5px; }
        .manual-join input { flex: 1; padding: 5px; font-size: 0.8rem; border: 1px solid #ccc; }
        .manual-join button { padding: 5px 10px; cursor: pointer; background: #eee; border: 1px solid #ccc; font-size: 0.8rem; }

    </style>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>

    <div id="connect-overlay" class="hidden">
        <div class="spinner">⏳</div>
        <div>Conectando...</div>
    </div>

    <header>
        <div id="title-container">
            <div id="title" contenteditable="true" spellcheck="false">NUEVA LISTA</div>
        </div>
        <div class="actions">
            <div class="icon-btn" id="btn-sort" title="Ordenar">🔤<span class="sort-badge" id="sort-badge"></span></div>
            <div class="icon-btn" id="btn-aisle" title="Ordenar por Pasillos">🏪<span class="sort-badge" id="aisle-badge"></span></div>
            
            <div class="icon-btn" id="btn-clear" title="Limpiar completados">☑️</div>
            <div class="icon-btn" id="btn-wipe" title="Borrar todo" style="color:#d32f2f;">🚮</div>
            
            <div class="icon-btn" id="btn-library" title="Mis Listas">📚</div>
            <div class="icon-btn" id="btn-users" title="Compartido con">👥<div id="conn-dot"></div></div>
            <div class="icon-btn" id="btn-share" title="Compartir">🔗</div>
        </div>
    </header>

    <main id="viewport">
        <div class="slot"><input id="i1" placeholder="Escribe aquí..." autocomplete="off"></div>
        <div class="slot"><input id="i2" placeholder="Escribe aquí..." autocomplete="off"></div>
        
        <div id="pending-box"></div>
        <div id="completed-box"></div>
    </main>

    <!-- MODAL: USERS -->
    <div id="modal-users" class="modal-overlay hidden">
        <div class="modal-box">
            <div class="close-x" id="close-users">×</div>
            <h3 class="menu-header">Compartido con</h3>
            <div style="margin-bottom: 15px; padding: 10px; background: #f5f5f5; border-radius: 4px;">
                <label style="font-size:0.8rem; font-weight:bold; color:#666;">TU NOMBRE:</label>
                <div id="my-username" contenteditable="true" style="font-weight:bold; border-bottom:1px dashed #999; padding:2px;">Anon</div>
            </div>
            <div id="peer-list">
                <div style="color:#999; font-style:italic; padding:10px;">Modo Local (Offline)</div>
            </div>
        </div>
    </div>

    <!-- MODAL: LIBRARY -->
    <div id="modal-library" class="modal-overlay hidden">
        <div class="modal-box" style="max-width: 500px;">
            <div class="close-x" id="close-library">×</div>
            <div class="lib-columns">
                <div class="lib-col">
                    <h4>Mis Listas</h4>
                    <div id="list-local-container"></div>
                    <div style="margin-top:10px; text-align:center;">
                        <button id="btn-new-local" style="padding:5px 10px; font-size:0.8rem; cursor:pointer;">+ Nueva</button>
                    </div>
                </div>
                <div class="lib-col" style="border-left:1px solid #eee; padding-left:15px;">
                    <h4>Listas Compartidas</h4>
                    <div id="list-shared-container"></div>
                    <div class="manual-join">
                        <input id="input-join-id" placeholder="ID de Sala..." />
                        <button id="btn-join-manual">Entrar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="toast">¡Notificación!</div>

            "carne": "Carnes y Pescados 🥩", "res": "Carnes y Pescados 🥩", "bistec": "Carnes y Pescados 🥩", "molida": "Carnes y Pescados 🥩", "pollo": "Carnes y Pescados 🥩", "pechuga": "Carnes y Pescados 🥩", "pierna": "Carnes y Pescados 🥩", "muslo": "Carnes y Pescados 🥩", "milanesa": "Carnes y Pescados 🥩", "jamon": "Carnes y Pescados 🥩", "salchicha": "Carnes y Pescados 🥩", "chorizo": "Carnes y Pescados 🥩", "tocino": "Carnes y Pescados 🥩", "pescado": "Carnes y Pescados 🥩", "atun": "Carnes y Pescados 🥩", "camaron": "Carnes y Pescados 🥩", "filete": "Carnes y Pescados 🥩", "cerdo": "Carnes y Pescados 🥩", "chuleta": "Carnes y Pescados 🥩",

            "arroz": "Despensa y Abarrotes 🥫", "frijol": "Despensa y Abarrotes 🥫", "frijoles": "Despensa y Abarrotes 🥫", "pasta": "Despensa y Abarrotes 🥫", "sopa": "Despensa y Abarrotes 🥫", "aceite": "Despensa y Abarrotes 🥫", "azucar": "Despensa y Abarrotes 🥫", "sal": "Despensa y Abarrotes 🥫", "harina": "Despensa y Abarrotes 🥫", "cafe": "Despensa y Abarrotes 🥫", "te": "Despensa y Abarrotes 🥫", "cereal": "Despensa y Abarrotes 🥫", "avena": "Despensa y Abarrotes 🥫", "atun en lata": "Despensa y Abarrotes 🥫", "sardinas": "Despensa y Abarrotes 🥫", "mayonesa": "Despensa y Abarrotes 🥫", "catsup": "Despensa y Abarrotes 🥫", "mostaza": "Despensa y Abarrotes 🥫", "salsa": "Despensa y Abarrotes 🥫", "pure de tomate": "Despensa y Abarrotes 🥫", "chiles en lata": "Despensa y Abarrotes 🥫", "consome": "Despensa y Abarrotes 🥫",
            "refresco": "Bebidas 🥤", "coca": "Bebidas 🥤", "agua": "Bebidas 🥤", "jugo": "Bebidas 🥤", "cerveza": "Bebidas 🥤", "vino": "Bebidas 🥤", "tequila": "Bebidas 🥤", "chelas": "Bebidas 🥤",
            "papas": "Botanas y Dulces 🍫", "sabritas": "Botanas y Dulces 🍫", "botana": "Botanas y Dulces 🍫", "chocolate": "Botanas y Dulces 🍫", "dulces": "Botanas y Dulces 🍫", "chicles": "Botanas y Dulces 🍫", "cacahuates": "Botanas y Dulces 🍫", "palomitas": "Botanas y Dulces 🍫",
            "detergente": "Limpieza y Hogar 🧹", "jabon": "Limpieza y Hogar 🧹", "cloro": "Limpieza y Hogar 🧹", "suavitel": "Limpieza y Hogar 🧹", "fabuloso": "Limpieza y Hogar 🧹", "papel higienico": "Limpieza y Hogar 🧹", "servilletas": "Limpieza y Hogar 🧹", "bolsas basura": "Limpieza y Hogar 🧹", "escoba": "Limpieza y Hogar 🧹", "trapeador": "Limpieza y Hogar 🧹", "fibras": "Limpieza y Hogar 🧹",
            "shampoo": "Higiene Personal 🛁", "acondicionador": "Higiene Personal 🛁", "jabon corporal": "Higiene Personal 🛁", "desodorante": "Higiene Personal 🛁", "pasta dental": "Higiene Personal 🛁", "cepillo dientes": "Higiene Personal 🛁", "crema corporal": "Higiene Personal 🛁", "toallas femeninas": "Higiene Personal 🛁", "rastrillos": "Higiene Personal 🛁",
            "croquetas": "Mascotas 🐶", "alimento perro": "Mascotas 🐶", "alimento gato": "Mascotas 🐶", "arena gato": "Mascotas 🐶",
            "aspirina": "Farmacia 💊", "paracetamol": "Farmacia 💊", "ibuprofeno": "Farmacia 💊", "curitas": "Farmacia 💊", "alcohol": "Farmacia 💊", "vitaminas": "Farmacia 💊", "condones": "Farmacia 💊",
            "pañales": "Bebés 🍼", "panales": "Bebés 🍼", "toallitas humedas": "Bebés 🍼", "formula": "Bebés 🍼", "gerber": "Bebés 🍼"
        };

        const App = {
            config: { 
                broker: 'wss://broker.hivemq.com:8884/mqtt',
                indexLocal: 'listolista_index_local',
                indexShared: 'listolista_index_shared',
                storePrefix: 'listolista_data_'
            },
            
            state: { 
                items: [], // { id, text, category, done, deleted, timestamp, lastAuthor }
                meta: { title: "NUEVA LISTA", timestamp: 0, lastAuthor: "" }
            },
            
            myId: localStorage.getItem('listolista_username') || 'User_' + Math.floor(Math.random() * 1000),
            peers: {},
            client: null,
            roomId: null,
            isShared: false,
            sortMode: 'time', // time | asc | desc | aisle

            init() {
                this.cacheDOM();
                this.detectMode();
                this.load(); 
                this.bind();
                
                if (this.isShared) {
                    this.dom.overlay.classList.remove('hidden'); 
                    this.connectMQTT();
                } else {
                    this.dom.connDot.className = 'orange'; 
                }
                
                this.render();
                this.dom.i1.focus();
                this.dom.username.innerText = this.myId;
            },

            cacheDOM() {
                this.dom = {
                    title: document.getElementById('title'),
                    i1: document.getElementById('i1'),
                    i2: document.getElementById('i2'),
                    pBox: document.getElementById('pending-box'),
                    cBox: document.getElementById('completed-box'),
                    username: document.getElementById('my-username'),
                    peerList: document.getElementById('peer-list'),
                    localList: document.getElementById('list-local-container'),
                    sharedList: document.getElementById('list-shared-container'),
                    connDot: document.getElementById('conn-dot'),
                    toast: document.getElementById('toast'),
                    overlay: document.getElementById('connect-overlay'),
                    sortBadge: document.getElementById('sort-badge'),
                    aisleBadge: document.getElementById('aisle-badge'),
                    mUsers: document.getElementById('modal-users'),
                    mLib: document.getElementById('modal-library')
                };
            },

            detectMode() {
                const params = new URLSearchParams(window.location.search);
                const room = params.get('room');
                const localId = params.get('local');

                if (room) {
                    this.isShared = true;
                    this.roomId = room;
                    this.topics = {
                        data: `listolista/v2/${room}/data`,
                        presence: `listolista/v2/${room}/presence`
                    };
                    this.updateLibraryIndex(this.config.indexShared, room);
                } else {
                    this.isShared = false;
                    this.roomId = localId || localStorage.getItem('last_local_id') || 'local_' + Date.now();
                    
                    if (!localId) {
                        try {
                            const newUrl = window.location.pathname + '?local=' + this.roomId;
                            window.history.replaceState(null, null, newUrl);
                        } catch (e) { console.warn("Hist. update failed", e); }
                    }
                    
                    localStorage.setItem('last_local_id', this.roomId);
                    this.updateLibraryIndex(this.config.indexLocal, this.roomId);
                }
            },

            bind() {
                [this.dom.i1, this.dom.i2].forEach(input => {
                    input.onkeydown = e => { if (e.key === 'Enter') this.addItem(input); };
                    input.onblur = () => { if(input.value.trim()) this.addItem(input); };
                });

                this.dom.title.oninput = () => {
                    this.state.meta.title = this.dom.title.innerText;
                    this.state.meta.timestamp = Date.now();
                    const key = this.isShared ? this.config.indexShared : this.config.indexLocal;
                    this.updateLibraryIndex(key, this.roomId);
                    this.save();
                    if(this.isShared) this.publishState();
                };
                
                this.dom.title.onkeydown = (e) => {
                    if (e.key === 'Enter') { e.preventDefault(); this.dom.title.blur(); }
                };

                this.dom.username.onblur = () => {
                    this.myId = this.dom.username.innerText;
                    localStorage.setItem('listolista_username', this.myId);
                    if(this.isShared) this.publishPresence();
                };
                this.dom.username.onkeydown = (e) => {
                    if (e.key === 'Enter') { e.preventDefault(); this.dom.username.blur(); }
                };

                document.getElementById('btn-users').onclick = () => this.toggleModal('mUsers');
                document.getElementById('btn-library').onclick = () => {
                    this.renderLibrary();
                    this.toggleModal('mLib');
                };
                
                document.getElementById('btn-share').onclick = () => {
                    if (!this.isShared) {
                        if(confirm("¿Convertir esta lista en compartida?")) {
                            const newRoomId = 'room_' + Date.now().toString(36);
                            const currentData = JSON.stringify(this.state);
                            localStorage.setItem(this.config.storePrefix + newRoomId, currentData);
                            try {
                                const newUrl = window.location.origin + window.location.pathname + '?room=' + newRoomId;
                                navigator.clipboard.writeText(newUrl);
                                alert("Lista compartida creada. Enlace copiado al portapapeles.");
                                window.location.search = '?room=' + newRoomId;
                            } catch (e) { window.location.reload(); }
                        }
                    } else {
                        navigator.clipboard.writeText(window.location.href);
                        this.showToast("🔗 Enlace de sala copiado");
                    }
                };

                // SORTING LOGIC
                document.getElementById('btn-sort').onclick = () => {
                    this.sortMode = (this.sortMode === 'time') ? 'asc' : (this.sortMode === 'asc') ? 'desc' : 'time';
                    // Reset aisle mode if sorting by text
                    this.dom.aisleBadge.innerText = "";
                    this.render();
                };

                document.getElementById('btn-aisle').onclick = () => {
                    this.sortMode = (this.sortMode === 'aisle') ? 'time' : 'aisle';
                    // Reset text sort if aisle mode
                    this.dom.sortBadge.innerText = "";
                    this.render();
                };

                document.getElementById('btn-new-local').onclick = () => {
                    const newId = 'local_' + Date.now();
                    window.location.search = '?local=' + newId;
                };

                document.getElementById('close-users').onclick = () => this.dom.mUsers.classList.add('hidden');
                document.getElementById('close-library').onclick = () => this.dom.mLib.classList.add('hidden');

                document.getElementById('btn-clear').onclick = () => {
                    let changed = false;
                    this.state.items.forEach(i => {
                        if (i.done && !i.deleted) {
                            i.deleted = true;
                            i.timestamp = Date.now();
                            changed = true;
                        }
                    });
                    if (changed) {
                        this.state.meta.timestamp = Date.now();
                        this.save(); 
                        if(this.isShared) this.publishState();
                        this.render();
                    }
                };
                
                document.getElementById('btn-wipe').onclick = () => {
                    if(confirm("¿Borrar todo?")) {
                        let changed = false;
                        this.state.items.forEach(i => {
                            if (!i.deleted) {
                                i.deleted = true;
                                i.timestamp = Date.now();
                                changed = true;
                            }
                        });
                        if (changed) {
                            this.state.meta.timestamp = Date.now();
                            this.save(); 
                            if(this.isShared) this.publishState();
                            this.render();
                        }
                    }
                };

                document.getElementById('btn-join-manual').onclick = () => {
                    const id = document.getElementById('input-join-id').value.trim();
                    if(id) window.location.search = '?room=' + id;
                };
            },

            // --- CATEGORIZATION ENGINE ---
            normalize(str) {
                return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
            },

            categorize(text) {
                // 1. Direct Lookup
                const norm = this.normalize(text);
                if (SUPERMARKET_DICT[norm]) return SUPERMARKET_DICT[norm];

                // 2. Fuzzy Containment (e.g. "manzanas rojas" -> "manzana")
                // Check if any key in dictionary is part of the input
                for (let key in SUPERMARKET_DICT) {
                    // Start checking longer keys to avoid matching "pan" in "pantalla" incorrectly (heuristic)
                    // For simplicity, just check includes
                    if (norm.includes(key)) return SUPERMARKET_DICT[key];
                }

                return null;
            },

            // --- CORE LOGIC ---
            addItem(inputEl) {
                const txt = inputEl.value.trim();
                if (!txt) return;

                const cat = this.categorize(txt);

                this.state.items.push({
                    id: Date.now(),
                    text: txt,
                    category: cat,
                    done: false,
                    deleted: false,
                    timestamp: Date.now(),
                    lastAuthor: this.myId
                });

                inputEl.value = '';
                inputEl.focus();
                this.save();
                if(this.isShared) this.publishState();
                this.render();
            },

            toggleItem(id) {
                const item = this.state.items.find(i => i.id === id);
                if (item) {
                    item.done = !item.done;
                    item.timestamp = Date.now(); 
                    this.save();
                    if(this.isShared) this.publishState();
                    this.render();
                }
            },

            deleteItem(id, e) {
                e.stopPropagation();
                const item = this.state.items.find(i => i.id === id);
                if (item) {
                    item.deleted = true;
                    item.timestamp = Date.now(); 
                    this.state.meta.timestamp = Date.now();
                    this.save();
                    if(this.isShared) this.publishState();
                    this.render();
                }
            },

            connectMQTT() {
                this.client = mqtt.connect(this.config.broker);
                
                this.client.on('connect', () => {
                    this.dom.overlay.classList.add('hidden'); 
                    this.dom.connDot.className = 'green';
                    this.client.subscribe([this.topics.data, this.topics.presence]);
                    this.publishPresence();
                    setInterval(() => this.publishPresence(), 5000); 
                    
                    if (this.state.items.length > 0) this.publishState();
                });

                this.client.on('message', (topic, msg) => {
                    try {
                        const payload = JSON.parse(msg.toString());
                        if (topic === this.topics.data) this.handleSync(payload);
                        else if (topic === this.topics.presence) this.handlePresence(payload);
                    } catch(e) {}
                });
            },

            handleSync(remoteState) {
                let changed = false;

                if (remoteState.meta && remoteState.meta.timestamp > this.state.meta.timestamp) {
                    this.state.meta = remoteState.meta;
                    this.dom.title.innerText = remoteState.meta.title;
                    const key = this.isShared ? this.config.indexShared : this.config.indexLocal;
                    this.updateLibraryIndex(key, this.roomId);
                    changed = true;
                }

                const localMap = new Map(this.state.items.map(i => [i.id, i]));
                
                remoteState.items.forEach(rItem => {
                    const lItem = localMap.get(rItem.id);
                    if (!lItem || rItem.timestamp > lItem.timestamp) {
                        localMap.set(rItem.id, rItem);
                        changed = true;
                    }
                });

                if (changed) {
                    this.state.items = Array.from(localMap.values());
                    this.save();
                    this.render();
                }
            },

            handlePresence(packet) {
                this.peers[packet.id] = Date.now();
                this.renderPeers();
            },

            publishState() {
                if (this.client) {
                    this.client.publish(this.topics.data, JSON.stringify(this.state), { retain: true });
                }
            },

            publishPresence() {
                if (this.client) {
                    this.client.publish(this.topics.presence, JSON.stringify({ id: this.myId }));
                }
            },

            save() {
                localStorage.setItem(this.config.storePrefix + this.roomId, JSON.stringify(this.state));
            },

            load() {
                const data = localStorage.getItem(this.config.storePrefix + this.roomId);
                if (data) {
                    try { this.state = JSON.parse(data); } catch(e) {}
                }
                this.dom.title.innerText = this.state.meta.title || "NUEVA LISTA";
            },

            updateLibraryIndex(indexKey, id) {
                let index = JSON.parse(localStorage.getItem(indexKey) || '{}');
                index[id] = {
                    title: this.state.meta.title || "Sin Título",
                    lastVisited: Date.now()
                };
                localStorage.setItem(indexKey, JSON.stringify(index));
            },

            renderLibrary() {
                const renderCol = (key, containerId, isSharedCol) => {
                    const index = JSON.parse(localStorage.getItem(key) || '{}');
                    const container = document.getElementById(containerId);
                    container.innerHTML = '';
                    
                    const sorted = Object.keys(index).sort((a,b) => index[b].lastVisited - index[a].lastVisited);
                    if(sorted.length === 0) container.innerHTML = '<div style="color:#aaa;font-size:0.8rem;padding:5px;">Vacío</div>';

                    sorted.forEach(rid => {
                        const meta = index[rid];
                        const div = document.createElement('div');
                        div.className = `saved-room ${rid === this.roomId ? 'active-room' : ''}`;
                        div.innerHTML = `<strong>${meta.title}</strong>`;
                        div.onclick = () => {
                            const param = isSharedCol ? 'room' : 'local';
                            window.location.search = `?${param}=${rid}`;
                        };
                        container.appendChild(div);
                    });
                };

                renderCol(this.config.indexLocal, 'list-local-container', false);
                renderCol(this.config.indexShared, 'list-shared-container', true);
            },

            render() {
                this.dom.pBox.innerHTML = '';
                this.dom.cBox.innerHTML = '';

                let pending = this.state.items.filter(i => !i.done && !i.deleted);
                const completed = this.state.items.filter(i => i.done && !i.deleted).sort((a,b) => b.timestamp - a.timestamp);

                if (this.sortMode === 'aisle') {
                    this.dom.aisleBadge.innerText = "ON";
                    this.dom.sortBadge.innerText = "";
                    
                    // Group by category
                    const grouped = {};
                    pending.forEach(i => {
                        const cat = i.category || "Otros 🛒";
                        if(!grouped[cat]) grouped[cat] = [];
                        grouped[cat].push(i);
                    });
                    
                    // Render groups
                    Object.keys(grouped).sort().forEach(cat => {
                        const header = document.createElement('div');
                        header.className = 'aisle-header';
                        header.innerText = cat;
                        this.dom.pBox.appendChild(header);
                        
                        grouped[cat].forEach(i => this.dom.pBox.appendChild(this.createRow(i)));
                    });
                    
                } else {
                    this.dom.aisleBadge.innerText = "";
                    
                    if (this.sortMode === 'asc') {
                        pending.sort((a,b) => a.text.localeCompare(b.text));
                        this.dom.sortBadge.innerText = "A-Z";
                    } else if (this.sortMode === 'desc') {
                        pending.sort((a,b) => b.text.localeCompare(a.text));
                        this.dom.sortBadge.innerText = "Z-A";
                    } else {
                        pending.sort((a,b) => a.timestamp - b.timestamp);
                        this.dom.sortBadge.innerText = "";
                    }
                    
                    pending.forEach(i => this.dom.pBox.appendChild(this.createRow(i)));
                }

                completed.forEach(i => this.dom.cBox.appendChild(this.createRow(i)));
                this.renderPeers();
            },

            createRow(item) {
                const div = document.createElement('div');
                div.className = `row ${item.done ? 'done' : ''}`;
                div.onclick = () => this.toggleItem(item.id);

                const content = document.createElement('div');
                content.className = 'item-content';
                
                const txt = document.createElement('div');
                txt.className = 'txt';
                txt.textContent = item.text;
                content.appendChild(txt);

                if(item.category) {
                    const cat = document.createElement('div');
                    cat.className = 'cat-tag';
                    cat.textContent = item.category;
                    content.appendChild(cat);
                }

                const del = document.createElement('div');
                del.className = 'del';
                del.innerHTML = '&times;';
                del.onclick = (e) => this.deleteItem(item.id, e);

                div.append(content, del);
                return div;
            },

            renderPeers() {
                const list = this.dom.peerList;
                list.innerHTML = '';
                
                if (!this.isShared) {
                    list.innerHTML = '<div style="color:#999; font-style:italic; padding:10px;">Modo Local (Offline)</div>';
                    return;
                }

                const now = Date.now();
                list.innerHTML = `<div class="user-row"><div class="dot"></div>${this.myId} (Tú)</div>`;
                
                Object.keys(this.peers).forEach(pid => {
                    if (now - this.peers[pid] < 10000) { 
                        const div = document.createElement('div');
                        div.className = 'user-row';
                        div.innerHTML = `<div class="dot"></div>${pid}`;
                        list.appendChild(div);
                    }
                });
            },

            toggleModal(key) {
                const el = this.dom[key];
                if (el.classList.contains('hidden')) el.classList.remove('hidden');
                else el.classList.add('hidden');
            },

            showToast(msg) {
                this.dom.toast.textContent = msg;
                this.dom.toast.classList.add('show');
                setTimeout(() => this.dom.toast.classList.remove('show'), 2000);
            }
        };

        App.init();
    </script>
