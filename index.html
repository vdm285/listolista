<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ListoLista</title>
    <style>
        /* [DESIGN SYSTEM: PRAGMATIC UTILITY] */
        :root {
            --h-header: 40px;
            --h-item: 55px;
            --color-text: #000;
            --color-bg: #fff;
            --color-dim: #eee;
            --font-stack: system-ui, -apple-system, sans-serif;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body, html {
            margin: 0; padding: 0;
            height: 100%; width: 100%;
            font-family: var(--font-stack);
            background: var(--color-bg);
            color: var(--color-text);
            overflow: hidden; 
        }

        /* --- FIXED HEADER --- */
        header {
            height: var(--h-header);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 1rem;
            border-bottom: 2px solid var(--color-text);
            position: fixed;
            top: 0; left: 0; right: 0;
            background: var(--color-bg);
            z-index: 10;
        }

        #title { font-weight: bold; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }
        #menu { cursor: pointer; font-size: 1.2rem; }

        /* --- SCROLLABLE VIEWPORT --- */
        main {
            position: absolute;
            top: var(--h-header);
            bottom: 0;
            left: 0; right: 0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        /* --- COMPONENT: INPUT STREAM --- */
        .slot {
            min-height: var(--h-item);
            border-bottom: 1px solid var(--color-dim);
            display: flex;
            align-items: center;
            padding: 0 1rem;
        }

        .slot input {
            width: 100%; height: 100%; border: none;
            font-size: 1.1rem; font-family: inherit; outline: none; background: transparent;
        }

        /* --- COMPONENT: LIST ITEMS --- */
        .row {
            min-height: var(--h-item);
            border-bottom: 1px solid var(--color-dim);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1rem;
            cursor: pointer;
            user-select: none;
            transition: background 0.1s;
        }

        .txt { flex-grow: 1; font-size: 1.1rem; padding: 12px 0; }
        
        .del {
            padding: 10px 0 10px 20px;
            color: var(--color-text);
            font-weight: bold;
            font-size: 1.4rem;
        }

        /* STATE: COMPLETED */
        .done { background-color: #fcfcfc; color: #aaa; }
        .done .txt { text-decoration: line-through; }

        /* --- COMPONENT: MENU MODAL (New) --- */
        #modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            z-index: 50;
            display: flex; justify-content: center; align-items: center;
            backdrop-filter: blur(2px);
        }
        
        .hidden { display: none !important; }

        #modal-box {
            background: var(--color-bg);
            width: 80%;
            max-width: 300px;
            border: 2px solid var(--color-text);
            padding: 1.5rem;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.2);
        }

        .menu-opt {
            padding: 10px 0;
            border-bottom: 1px dashed var(--color-dim);
            font-size: 1rem;
            color: #555;
            cursor: pointer;
        }
        .menu-opt:last-child { border-bottom: none; }
        .menu-opt:hover { color: #000; }
        
    </style>
</head>
<body>

    <header>
        <div id="title">Mi Lista</div>
        <div id="menu">☰</div>
    </header>

    <main id="viewport">
        <!-- Input Stream -->
        <div class="slot"><input id="i1" placeholder="Type here..." autocomplete="off"></div>
        <div class="slot"><input id="i2" placeholder="..." autocomplete="off"></div>
        
        <div id="pending-box"></div>
        <div id="completed-box"></div>
    </main>

    <!-- MENU OVERLAY -->
    <div id="modal-overlay" class="hidden">
        <div id="modal-box">
            <h3 style="margin-top:0; text-transform:uppercase; font-size:0.9rem;">Options</h3>
            <div class="menu-opt">Export List (Mock)</div>
            <div class="menu-opt">Theme: Dark (Mock)</div>
            <div class="menu-opt">Clear Completed (Mock)</div>
            <div class="menu-opt" style="font-weight:bold; margin-top:10px;" id="close-btn">Close</div>
        </div>
    </div>

    <script>
        const App = {
            state: { items: [] },
            config: { storageKey: 'listolista_v1' },

            init() {
                this.cacheDOM();
                this.load(); // Load from LocalStorage
                this.bind();
                this.render();
                this.dom.i1.focus();
            },

            cacheDOM() {
                this.dom = {
                    i1: document.getElementById('i1'),
                    i2: document.getElementById('i2'),
                    pBox: document.getElementById('pending-box'),
                    cBox: document.getElementById('completed-box'),
                    menuBtn: document.getElementById('menu'),
                    modal: document.getElementById('modal-overlay'),
                    closeBtn: document.getElementById('close-btn')
                };
            },

            bind() {
                // Input Stream
                [this.dom.i1, this.dom.i2].forEach(input => {
                    input.onkeydown = e => { if (e.key === 'Enter') this.add(input); };
                    input.onblur = () => { setTimeout(() => this.add(input), 150); };
                });

                // Menu Interactions
                this.dom.menuBtn.onclick = () => this.dom.modal.classList.remove('hidden');
                this.dom.closeBtn.onclick = () => this.dom.modal.classList.add('hidden');
                // Close on backdrop click
                this.dom.modal.onclick = (e) => {
                    if (e.target === this.dom.modal) this.dom.modal.classList.add('hidden');
                };
            },

            // --- PERSISTENCE LAYER ---
            load() {
                const data = localStorage.getItem(this.config.storageKey);
                if (data) {
                    try {
                        this.state.items = JSON.parse(data);
                    } catch (e) { console.error('Data corruption', e); }
                }
            },

            save() {
                localStorage.setItem(this.config.storageKey, JSON.stringify(this.state.items));
            },

            // --- LOGIC ---
            add(el) {
                const val = el.value.trim();
                if (!val) return;

                this.state.items.push({
                    id: Date.now(),
                    txt: val,
                    done: false,
                    ts: Date.now(),
                    dt: null
                });

                el.value = '';
                el.focus();
                this.save(); // Persist
                this.render();
            },

            toggle(id) {
                const item = this.state.items.find(i => i.id === id);
                if (item) {
                    item.done = !item.done;
                    item.dt = item.done ? Date.now() : null;
                    this.save(); // Persist
                    this.render();
                }
            },

            remove(id, e) {
                e.stopPropagation();
                this.state.items = this.state.items.filter(i => i.id !== id);
                this.save(); // Persist
                this.render();
            },

            render() {
                this.dom.pBox.innerHTML = '';
                this.dom.cBox.innerHTML = '';

                const pending = this.state.items.filter(i => !i.done).sort((a,b) => a.ts - b.ts);
                const completed = this.state.items.filter(i => i.done).sort((a,b) => b.dt - a.dt);

                pending.forEach(i => this.dom.pBox.appendChild(this.row(i)));
                completed.forEach(i => this.dom.cBox.appendChild(this.row(i)));
            },

            row(item) {
                const div = document.createElement('div');
                div.className = `row ${item.done ? 'done' : ''}`;
                div.onclick = () => this.toggle(item.id);

                const txt = document.createElement('div');
                txt.className = 'txt';
                txt.textContent = item.txt;

                const del = document.createElement('div');
                del.className = 'del';
                del.innerHTML = '&times;';
                del.onclick = (e) => this.remove(item.id, e);

                div.append(txt, del);
                return div;
            }
        };

        App.init();
    </script>
</body>
</html>
