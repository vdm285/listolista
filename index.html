<script>
// ListoLista aisle matcher: which supermarket aisle does a free-text item belong to?
// Plain script (no modules, no libraries): defines the global `ListoAisles`.
// Runs in browsers and in macOS `jsc` (tests: tests/run.sh).
//
// SPEC (docs/research/2026-09-25-aisle-sorting.md, "Recommendation for checkpoint 1")
//
// ListoAisles.fold(text) -> string
//   Lowercase; remove accents and marks (NFD, then drop \p{M}, so ñ -> n, é -> e); a "." or ","
//   between two digits becomes "." (decimals: "1,5" -> "1.5"); every other character that is not
//   a letter, digit or "/" becomes a space; collapse spaces; trim.
//
// ListoAisles.stripQuantity(folded) -> string
//   Removes a quantity at the START or END of an already folded text, e.g.
//     "2 kg de tortillas" -> "tortillas", "1/2 docena de huevos" -> "huevos",
//     "medio kilo de jamon de pavo" -> "jamon de pavo", "coca cola 3 litros" -> "coca cola",
//     "3 leches" -> "leches", "panales etapa 3" -> "panales etapa".
//   A quantity is: a number (digits, "1/2", "1.5") optionally followed by a unit and/or "de";
//   or a number WORD (un, una, medio, media, dos ... diez) only when followed by a unit.
//   Units: kg, kilo, kilos, g, gr, gramos, l, lt, litro, litros, ml, pieza, piezas, pz,
//   paquete, paquetes, docena, docenas, lata, latas, bolsa, bolsas, caja, cajas.
//   Number words NOT followed by a unit stay: "tres leches" stays "tres leches".
//
// ListoAisles.buildIndex(dict) -> index
//   dict = { AISLE_ID: [term, term, ...], ... }. Terms may contain accents or several words;
//   fold them the same way as items. The index is whatever aisleOf needs (precompute here, not
//   on every call).
//
// ListoAisles.aisleOf(text, index, overrides) -> { id, term, guess }
//   id: an aisle id from the dict, or "OTR" when nothing matches. term: the matched dictionary
//   term (folded) or null. guess: true only for a typo-fallback match.
//   Steps, in order:
//   1. key = stripQuantity(fold(text)). Empty key -> { id: "OTR", term: null, guess: false }.
//   2. overrides (optional object { folded item name: AISLE_ID }): if overrides[key] exists,
//      return it (term = key, guess = false).
//   3. Whole-word phrase scan over the words of key. A dictionary term of n words matches at
//      position i when each of its words equals the item word at i+j OR one of that word's
//      singular candidates: w, w minus final "s", w minus final "es", and "ces" -> "z"
//      (nueces -> nuez). Never match inside a word ("pan" must not match "pantuflas").
//      Prefer the term with the MOST words; among equal word counts, the LEFTMOST match.
//      Filler words alone never match: de, del, la, el, los, las, para, con, sin, y, en, al, marca.
//   4. Typo fallback, only when step 3 found nothing: for each item word with 5+ letters, find
//      single-word terms at Damerau-Levenshtein distance 1 (distance up to 2 when the word has
//      8+ letters). Take the smallest distance found; accept only if ALL terms at that distance
//      belong to the SAME aisle; return that with guess = true.
//   5. Otherwise { id: "OTR", term: null, guess: false }.
//
// ListoAisles.AISLES: [{ id, name }] in the default walking order:
//   FRU Frutas y verduras, PAN Panadería y tortillería, CAR Carnes y salchichonería,
//   LAC Lácteos y huevo, CON Congelados, DES Despensa, BOT Botanas y dulces,
//   BEB Bebidas y licores, LIM Limpieza y hogar, HIG Higiene personal, FAR Farmacia,
//   BBE Bebés, MAS Mascotas, OTR Otros.

var ListoAisles = (function () {
  'use strict';

  /* ---------- constants ---------- */
  var FILLERS = { de: 1, del: 1, la: 1, el: 1, los: 1, las: 1,
                  para: 1, con: 1, sin: 1, y: 1, en: 1, al: 1, marca: 1 };

  var UNITS = { kg: 1, kilo: 1, kilos: 1, g: 1, gr: 1, gramos: 1,
                l: 1, lt: 1, litro: 1, litros: 1, ml: 1,
                pieza: 1, piezas: 1, pz: 1,
                paquete: 1, paquetes: 1, docena: 1, docenas: 1,
                lata: 1, latas: 1, bolsa: 1, bolsas: 1, caja: 1, cajas: 1 };

  var NUM_WORDS = { un: 1, una: 1, uno: 1, medio: 1, media: 1,
                    dos: 1, tres: 1, cuatro: 1, cinco: 1,
                    seis: 1, siete: 1, ocho: 1, nueve: 1, diez: 1 };

  /* ---------- fold ---------- */
  function fold(text) {
    // 1. lowercase
    text = text.toLowerCase();
    // 2. NFD + strip combining marks; also ñ -> n
    text = text.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/ñ/g, 'n');
    // 3+4. decimal comma/dot between digits stays, everything else non-alnum/slash -> space
    //       single pass so the dot from step 3 is not eaten by step 4
    text = text.replace(/(\d)[.,](\d)|[^a-z0-9\/]/g, function (m, d1, d2) {
      return d1 !== undefined ? d1 + '.' + d2 : ' ';
    });
    // 5. collapse & trim
    return text.replace(/  +/g, ' ').trim();
  }

  /* ---------- stripQuantity ---------- */
  function stripQuantity(s) {
    var unitsRe = '(?:' + Object.keys(UNITS).join('|') + ')';
    var numWordRe = '(?:' + Object.keys(NUM_WORDS).join('|') + ')';
    var num = '(?:\\d+/\\d+|\\d+\\.\\d+|\\d+)';
    var qty = num + '\\b(?:\\s+' + unitsRe + '\\b)?(?:\\s+de)?';
    var qtyWord = numWordRe + '(?:\\s+' + unitsRe + '\\b)(?:\\s+de)?';
    var startRe = new RegExp('^\\s*(?:(' + qty + '|' + qtyWord + ')\\s*)(.*)');
    var endRe = new RegExp('^(.*)\\s*(?:(' + qty + '|' + qtyWord + '))\\s*$');

    // try removing from the start
    var m = s.match(startRe);
    if (m && m[2] && m[2].trim()) return m[2].trim();

    // try removing from the end
    m = s.match(endRe);
    if (m && m[1] && m[1].trim()) return m[1].trim();

    return s;
  }

  /* ---------- singular candidates ---------- */
  function singulars(word) {
    var cands = [word];
    if (word.length > 1 && word[word.length - 1] === 's') {
      cands.push(word.slice(0, -1));
      if (word.length > 2 && word.slice(-2) === 'es') {
        cands.push(word.slice(0, -2));
      }
    }
    if (word.length > 3 && word.slice(-3) === 'ces') {
      cands.push(word.slice(0, -3) + 'z');
    }
    return cands;
  }

  /* ---------- Damerau-Levenshtein distance ---------- */
  function dl(a, b) {
    var m = a.length, n = b.length;
    if (Math.abs(m - n) > 2) return 99;
    var d = [];
    for (var i = 0; i <= m; i++) { d[i] = [i]; }
    for (var j = 0; j <= n; j++) { d[0][j] = j; }
    for (var i = 1; i <= m; i++) {
      for (var j = 1; j <= n; j++) {
        var cost = a[i - 1] === b[j - 1] ? 0 : 1;
        d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1,
                           d[i - 1][j - 1] + cost);
        if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) {
          d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + cost);
        }
      }
    }
    return d[m][n];
  }

  /* ---------- buildIndex ---------- */
  function buildIndex(dict) {
    var index = { aisles: {}, singles: {} };
    for (var aid in dict) {
      index.aisles[aid] = [];
      for (var i = 0; i < dict[aid].length; i++) {
        var ft = fold(dict[aid][i]);
        index.aisles[aid].push(ft);
        var words = ft.split(' ');
        if (words.length === 1) {
          if (!index.singles[ft]) index.singles[ft] = [];
          index.singles[ft].push(aid);
        }
      }
    }
    return index;
  }

  /* ---------- aisleOf ---------- */
  function aisleOf(text, index, overrides) {
    var key = stripQuantity(fold(text));
    if (!key) return { id: 'OTR', term: null, guess: false };

    // step 2 – overrides
    if (overrides && Object.prototype.hasOwnProperty.call(overrides, key)) {
      return { id: overrides[key], term: key, guess: false };
    }

    var words = key.split(' ');

    // step 3 – whole-word phrase scan
    var best = null; // { aisle, term, wc, pos }
    var allAisleIds = Object.keys(index.aisles);
    for (var ai = 0; ai < allAisleIds.length; ai++) {
      var aid = allAisleIds[ai];
      var terms = index.aisles[aid];
      for (var ti = 0; ti < terms.length; ti++) {
        var tw = terms[ti].split(' ');
        var twc = tw.length;
        if (twc > words.length) continue;

        // skip filler-only terms
        var allFiller = true;
        for (var f = 0; f < twc; f++) { if (!Object.prototype.hasOwnProperty.call(FILLERS, tw[f])) { allFiller = false; break; } }
        if (allFiller) continue;

        var bestPos = -1;
        var maxEnd = words.length - twc + 1;
        for (var pos = 0; pos < maxEnd; pos++) {
          var ok = true;
          for (var j = 0; j < twc; j++) {
            var cand = singulars(words[pos + j]);
            if (cand.indexOf(tw[j]) === -1) { ok = false; break; }
          }
          if (ok) {
            if (bestPos === -1) bestPos = pos;
            break; // leftmost position for this term
          }
        }
        if (bestPos !== -1) {
          if (!best || twc > best.wc || (twc === best.wc && bestPos < best.pos)) {
            best = { aisle: aid, term: terms[ti], wc: twc, pos: bestPos };
          }
        }
      }
    }
    if (best) {
      return { id: best.aisle, term: best.term, guess: false };
    }

    // step 4 – typo fallback
    var maxDist = 1;
    // for 8+ letter words allow distance 2
    var bestDist = 99;
    var bestAisle = null;
    var bestTerm = null;
    var foundAny = false;

    for (var wi = 0; wi < words.length; wi++) {
      if (words[wi].length < 5) continue;
      var limit = words[wi].length >= 8 ? 2 : 1;
      for (var st in index.singles) {
        if (!Object.prototype.hasOwnProperty.call(index.singles, st)) continue;
        var dist = dl(words[wi], st);
        if (dist > limit) continue;
        if (dist > bestDist) continue;
        foundAny = true;
        if (dist < bestDist) {
          bestDist = dist;
          bestAisle = index.singles[st].slice();
          bestTerm = st;
        } else if (dist === bestDist) {
          // merge aisles – copy first so we don't mutate the index
          var merged = bestAisle.slice();
          for (var k = 0; k < index.singles[st].length; k++) {
            var a = index.singles[st][k];
            var already = false;
            for (var l = 0; l < merged.length; l++) {
              if (merged[l] === a) { already = true; break; }
            }
            if (!already) merged.push(a);
          }
          bestAisle = merged;
        }
      }
    }

    if (foundAny && bestAisle && bestAisle.length === 1) {
      return { id: bestAisle[0], term: bestTerm, guess: true };
    }

    // step 5
    return { id: 'OTR', term: null, guess: false };
  }

  /* ---------- AISLES list ---------- */
  var AISLES = [
    { id: 'FRU', name: 'Frutas y verduras' },
    { id: 'PAN', name: 'Panadería y tortillería' },
    { id: 'CAR', name: 'Carnes y salchichonería' },
    { id: 'LAC', name: 'Lácteos y huevo' },
    { id: 'CON', name: 'Congelados' },
    { id: 'DES', name: 'Despensa' },
    { id: 'BOT', name: 'Botanas y dulces' },
    { id: 'BEB', name: 'Bebidas y licores' },
    { id: 'LIM', name: 'Limpieza y hogar' },
    { id: 'HIG', name: 'Higiene personal' },
    { id: 'FAR', name: 'Farmacia' },
    { id: 'BBE', name: 'Bebés' },
    { id: 'MAS', name: 'Mascotas' },
    { id: 'OTR', name: 'Otros' }
  ];

  return { fold: fold, stripQuantity: stripQuantity,
           buildIndex: buildIndex, aisleOf: aisleOf, AISLES: AISLES };
})();

<script>
// ListoLista merge: combine this phone's copy of a list with a copy from another phone.
// Plain script (no modules, no libraries): defines the global `ListoMerge`.
// Runs in browsers and in macOS `jsc` (tests: tests/run.sh).
//
// SPEC
// A list state looks like:
//   { items: [{ id, text, done, deleted, timestamp, ... }],
//     meta:  { title, timestamp },
//     ovr:   { "<folded item name>": { aisle: "<AISLE_ID>", ts: <number> }, ... },   // optional
//     order: { ids: ["FRU", "PAN", ...], ts: <number> } }                              // optional
// Deleted items stay in the list with deleted: true (so the deletion can travel to other phones).
// A missing timestamp/ts counts as 0. A missing items array counts as empty.
//
// ListoMerge.merge(local, remote) -> { state, changed, localNewer }
//   items: union by id. For an id present in both, the copy with the LARGER timestamp wins;
//          on a tie the local copy stays. Order: local items keep their order; items only in
//          remote are appended in remote order.
//   meta:  the one with the larger meta.timestamp wins; tie -> local. Missing meta -> the other.
//   ovr:   per key, the entry with the larger ts wins; tie -> local. Omit ovr from the result
//          when both sides lack it.
//   order: the whole object with the larger ts wins; tie -> local. Omit when both lack it.
//   Other top-level fields of local are kept as they are.
//   changed:    true when some remote entry (item, meta, ovr key, order) is missing from local or
//               has a strictly larger timestamp/ts (something came from remote).
//   localNewer: true when some local entry is missing from remote or has a strictly larger
//               timestamp/ts (so this phone should publish). Ties count as neither.
//   Never modify the input objects (return new objects/arrays; item objects may be shared).
//   Must accept remote = null/undefined (treat as an empty state).

var ListoMerge = (function () {
  'use strict';

  function getTs(obj, field) {
    // Missing timestamp / ts counts as 0.
    return (obj && obj[field] != null) ? obj[field] : 0;
  }

  function merge(local, remote) {
    var changed = false;
    var localNewer = false;

    // Must accept remote = null/undefined (treat as empty state).
    if (!remote) { remote = {}; }

    var state = {};

    // --- items ---
    var localItems = local.items || [];
    var remoteItems = remote.items || [];

    // Build lookup indices (keys are item ids).
    var localIdx = Object.create(null);
    for (var i = 0; i < localItems.length; i++) {
      localIdx[localItems[i].id] = i;
    }
    var remoteIdx = Object.create(null);
    for (var j = 0; j < remoteItems.length; j++) {
      remoteIdx[remoteItems[j].id] = j;
    }

    // Merge: local items keep their order; remote-only appended in remote order.
    var mergedItems = [];
    for (var i = 0; i < localItems.length; i++) {
      var li = localItems[i];
      if (Object.prototype.hasOwnProperty.call(remoteIdx, li.id)) {
        var ri = remoteItems[remoteIdx[li.id]];
        var lTs = getTs(li, 'timestamp');
        var rTs = getTs(ri, 'timestamp');
        if (rTs > lTs) {
          mergedItems.push(ri);
          changed = true;
        } else {
          mergedItems.push(li);
          if (lTs > rTs) { localNewer = true; }
        }
      } else {
        // Item only in local.
        mergedItems.push(li);
        localNewer = true;
      }
    }
    for (var j = 0; j < remoteItems.length; j++) {
      var ri = remoteItems[j];
      if (!Object.prototype.hasOwnProperty.call(localIdx, ri.id)) {
        // Item only in remote.
        mergedItems.push(ri);
        changed = true;
      }
    }
    state.items = mergedItems;

    // --- meta ---
    var lMeta = local.meta;
    var rMeta = remote.meta;
    if (lMeta && rMeta) {
      var lTs = getTs(lMeta, 'timestamp');
      var rTs = getTs(rMeta, 'timestamp');
      // The winning meta is kept whole (it may carry more fields than title/timestamp).
      if (rTs > lTs) {
        state.meta = rMeta;
        changed = true;
      } else {
        state.meta = lMeta;
        if (lTs > rTs) { localNewer = true; }
      }
    } else if (rMeta) {
      state.meta = rMeta;
      changed = true;
    } else if (lMeta) {
      state.meta = lMeta;
      localNewer = true;   // remote lacks it
    }

    // --- ovr (aisle corrections) ---
    var lOvr = local.ovr;
    var rOvr = remote.ovr;
    if (lOvr || rOvr) {
      var mergedOvr = {};
      if (lOvr) {
        for (var k in lOvr) {
          if (Object.prototype.hasOwnProperty.call(lOvr, k)) {
            // Key only in local (remote lacks it).
            if (!rOvr || !Object.prototype.hasOwnProperty.call(rOvr, k)) {
              localNewer = true;
            }
            mergedOvr[k] = { aisle: lOvr[k].aisle, ts: getTs(lOvr[k], 'ts') };
          }
        }
      }
      if (rOvr) {
        for (var k in rOvr) {
          if (Object.prototype.hasOwnProperty.call(rOvr, k)) {
            if (Object.prototype.hasOwnProperty.call(mergedOvr, k)) {
              var lTs = mergedOvr[k].ts;
              var rTs = getTs(rOvr[k], 'ts');
              if (rTs > lTs) {
                mergedOvr[k] = { aisle: rOvr[k].aisle, ts: rTs };
                changed = true;
              } else if (lTs > rTs) {
                localNewer = true;
              }
            } else {
              // Key only in remote (local lacks it).
              changed = true;
              mergedOvr[k] = { aisle: rOvr[k].aisle, ts: getTs(rOvr[k], 'ts') };
            }
          }
        }
      }
      state.ovr = mergedOvr;
    }

    // --- order (aisle order) ---
    var lOrd = local.order;
    var rOrd = remote.order;
    if (lOrd || rOrd) {
      if (lOrd && rOrd) {
        var lTs = getTs(lOrd, 'ts');
        var rTs = getTs(rOrd, 'ts');
        if (rTs > lTs) {
          state.order = { ids: rOrd.ids.slice(), ts: rTs };
          changed = true;
        } else if (lTs > rTs) {
          state.order = { ids: lOrd.ids.slice(), ts: lTs };
          localNewer = true;
        } else {
          state.order = { ids: lOrd.ids.slice(), ts: lTs };
        }
      } else if (lOrd) {
        state.order = { ids: lOrd.ids.slice(), ts: getTs(lOrd, 'ts') };
        localNewer = true;
      } else {
        state.order = { ids: rOrd.ids.slice(), ts: getTs(rOrd, 'ts') };
        changed = true;
      }
    }

    // --- other local fields preserved as-is ---
    var stdKeys = { items: true, meta: true, ovr: true, order: true };
    for (var k in local) {
      if (!stdKeys[k]) {
        state[k] = local[k];
      }
    }

    return { state: state, changed: changed, localNewer: localNewer };
  }

  return { merge: merge };
})();

// ListoLista sync: end-to-end encryption + the phone side of the relay connection.
// Plain script (no modules, no libraries): defines the global `ListoSync`. Browser and Node 22+.
//
// A shared list's link carries a random 128-bit secret after '#k=' (browsers never send the part
// after '#' to any server). From it each phone derives, locally:
//   roomId  22 characters, SHA-256 of the secret: names the list on the relay
//   key     AES-GCM-256 via HKDF: encrypts the whole list (title, items, flags)
//   tok     128-bit write token via HKDF: the relay only accepts writes carrying it
// The relay stores and forwards only opaque blobs "v1.<iv>.<ciphertext>" (padded to 1 KB steps,
// so it can't even count items).
var ListoSync = (function () {
  'use strict';
  var enc = new TextEncoder(), dec = new TextDecoder();
  var PAD = 1024;

  function b64u(buf) {
    var bytes = new Uint8Array(buf), s = '';

    var roomId = b64u(h).slice(0, 22);

    var salt = enc.encode('listolista');

      ikm, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);

    }

  }

  function row(it, aisle) {
    var r = el('div', 'row' + (it.done ? ' done' : '') + (flashIds[it.id] ? ' flash' : ''));
    r.dataset.id = it.id;
    var txt = el('span', 'txt', it.text);
    txt.setAttribute('role', 'checkbox'); txt.setAttribute('aria-checked', it.done ? 'true' : 'false'); txt.tabIndex = 0;
    r.appendChild(txt);
    if (aisle) {
      var tag = el('button', 'tag' + (aisle.guess ? ' guess' : ''), aisleName(aisle.id) + (aisle.guess ? '?' : ''));
      tag.setAttribute('aria-label', 'Cambiar pasillo de ' + it.text + ' (ahora: ' + aisleName(aisle.id) + ')');
      tag.onclick = function (e) { e.stopPropagation(); aislePicker(it, aisle.id); };
      tag.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
      r.appendChild(tag);
    }
    // tap = strike / unstrike; long-press = edit / delete (one sheet per press, even on Android)
    var timer = null, long = false;
    var openSheet = function () { if (long) return; long = true; clearTimeout(timer); itemSheet(it); };
    r.addEventListener('pointerdown', function () { long = false; clearTimeout(timer); timer = setTimeout(openSheet, 550); });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) { r.addEventListener(ev, function () { clearTimeout(timer); }); });
    r.addEventListener('contextmenu', function (e) { e.preventDefault(); openSheet(); });
    r.addEventListener('click', function (e) {
      if (e.target.closest('.tag')) return;
      if (long) { long = false; return; }
      toggle(it.id); maybeLongPressHint();
    });
    txt.addEventListener('keydown', function (e) {
      if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggle(it.id); }
      if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); remove(it.id); }
      if (e.key === 'ContextMenu' || (e.shiftKey && e.key === 'F10')) { e.preventDefault(); itemSheet(it); }
    });
    return r;
  }

  // ---------- sheets (menu, lists, item actions, aisle picker, aisle order) ----------
  var closeOpenSheet = null;
  window.addEventListener('popstate', function () { if (closeOpenSheet) closeOpenSheet(true); });
  function sheet(build) {
    if (closeOpenSheet) closeOpenSheet();
    var bg = el('div', 'sheet-bg'), s = el('div', 'sheet');
    s.setAttribute('role', 'dialog'); s.setAttribute('aria-modal', 'true');
    bg.appendChild(s);
    var closed = false;
    var close = function (fromBack) {
      if (closed) return; closed = true; closeOpenSheet = null;
      bg.remove(); document.removeEventListener('keydown', esc);
      // leave the extra history entry harmless (Back then stays on this list)
      if (!fromBack && history.state && history.state.sheet) history.replaceState(null, '', location.href);
    };
    var esc = function (e) { if (e.key === 'Escape') close(); };
    bg.addEventListener('click', function (e) { if (e.target === bg) close(); });
    document.addEventListener('keydown', esc);
    var x = el('button', 'sheet-close', 'Cerrar');
    x.onclick = function () { close(); };
    s.appendChild(x);
    build(s, close);
    history.pushState({ sheet: true }, '', location.href);   // Back closes the sheet instead of leaving
    closeOpenSheet = close;
    document.body.appendChild(bg);
    var first = s.querySelector('input') || s.querySelector('.opt, .aisle-grid button, .order-row button');
    if (first) first.focus();
    return close;
  }
  function opt(label, onClick, extra) {
    var b = el('button', 'opt' + (extra && extra.warn ? ' warn' : ''));
    b.appendChild(el('span', '', label));
    if (extra && extra.small) b.appendChild(el('small', '', extra.small));
    if (extra && extra.sw != null) {
      b.appendChild(el('span', 'switch' + (extra.sw ? ' on' : '')));
      b.setAttribute('role', 'switch'); b.setAttribute('aria-checked', extra.sw ? 'true' : 'false');
    }
    b.onclick = onClick;
    return b;
  }

  function menu() {
    sheet(function (s, close) {
      s.appendChild(opt('Ordenar por pasillo', function () {
        view.aisles = !view.aisles; touchIndex(cur.id, { aisles: view.aisles }); close(); render();
      }, { sw: view.aisles }));
      s.appendChild(opt('Orden de los pasillos', function () { close(); orderSheet(); }, { small: 'como tu súper' }));
      s.appendChild(opt('Borrar tachados', function () { close(); clearDone(); }));
      s.appendChild(opt('Mis listas', function () { close(); listsSheet(); }));
      s.appendChild(opt('Nueva lista', function () { close(); openLocal('l_' + rid(8)); }));
      if (installPrompt) s.appendChild(opt('Instalar como app', function () { close(); installPrompt.prompt(); installPrompt = null; }));
      else if (isIOS() && !isStandalone()) s.appendChild(opt('Usar como app', function () {
        close();
        if (cur.secret) showInstallHint(true);
        else showHint('En iPhone, primero toca Compartir: el ícono de inicio debe crearse desde el enlace de la lista para que la abra.', null);
      }));
      s.appendChild(opt('Vaciar la lista', function () { close(); emptyList(); }, { warn: true }));
    });
  }

  function listsSheet() {
    sheet(function (s, close) {
      s.appendChild(el('h2', '', 'Mis listas'));
      var idx = listIndex();
      Object.keys(idx).sort(function (a, b) { return (idx[b].lastVisited || 0) - (idx[a].lastVisited || 0); }).forEach(function (id) {
        var e = idx[id];
        var b = opt((id === cur.id ? '• ' : '') + (e.title || 'LISTA'), function () {
          close(); if (e.secret) openShared(e.secret); else openLocal(id);
        }, { small: e.secret ? 'compartida' : (e.wasShared ? 'antes compartida' : 'solo aquí') });
        s.appendChild(b);
      });
      s.appendChild(opt('+ Nueva lista', function () { close(); openLocal('l_' + rid(8)); }));
      s.appendChild(el('h2', '', 'Abrir un enlace compartido'));
      var p = el('div', 'paste'), inp = el('input'), go = el('button', '', 'Abrir');
      inp.placeholder = 'Pega aquí el enlace'; inp.setAttribute('aria-label', 'Enlace compartido');
      go.onclick = function () {
        var m = /#k=([A-Za-z0-9_-]{22})/.exec(inp.value) || /^([A-Za-z0-9_-]{22})$/.exec(inp.value.trim());
        if (!m) { toast('No encuentro una lista en ese enlace.'); return; }
        close(); openShared(m[1]);
      };
      p.append(inp, go); s.appendChild(p);
    });
  }

  function itemSheet(it) {
    sheet(function (s, close) {
      s.appendChild(el('h2', '', it.text));
      var box = el('div', 'edit-box'), inp = el('input');
      inp.value = it.text; inp.setAttribute('aria-label', 'Editar artículo');
      inp.onkeydown = function (e) { if (e.key === 'Enter') { editText(it.id, inp.value); close(); } };
      box.appendChild(inp); s.appendChild(box);
      s.appendChild(opt('Guardar cambio', function () { editText(it.id, inp.value); close(); }));
      s.appendChild(opt('Cambiar pasillo', function () {
        close(); aislePicker(it, ListoAisles.aisleOf(it.text, aisles(), overrides()).id);
      }));
      s.appendChild(opt('Borrar', function () { close(); remove(it.id); }, { warn: true }));
    });
  }

  function aislePicker(it, currentId) {
    sheet(function (s, close) {
      s.appendChild(el('h2', '', '¿En qué pasillo está «' + it.text + '»?'));
      var grid = el('div', 'aisle-grid');
      aisleOrder().forEach(function (id) {
        var b = el('button', id === currentId ? 'cur' : '', aisleName(id));
        b.onclick = function () { close(); setAisle(it, id); toast('Recordado para esta lista.'); };
        grid.appendChild(b);
      });
      s.appendChild(grid);
    });
  }

  function orderSheet() {
    sheet(function (s) {
      s.appendChild(el('h2', '', 'Orden de los pasillos (como recorres tu súper)'));
      var list = el('div');
      var draw = function () {
        list.textContent = '';
        aisleOrder().forEach(function (id, i, all) {
          var r = el('div', 'order-row');
          r.appendChild(el('span', '', aisleName(id)));
          var up = el('button', '', '↑'), dn = el('button', '', '↓');
          up.setAttribute('aria-label', 'Subir ' + aisleName(id)); dn.setAttribute('aria-label', 'Bajar ' + aisleName(id));
          up.disabled = i === 0; dn.disabled = i === all.length - 1;
          up.onclick = function () { moveAisle(id, -1); draw(); };
          dn.onclick = function () { moveAisle(id, 1); draw(); };
          r.append(up, dn); list.appendChild(r);
        });
      };
      draw(); s.appendChild(list);
    });
  }

  // ---------- sharing ----------
  function share() {
    if (cur.secret) return offerLink();
    // Turn this list into a shared one: new secret, same items, now end-to-end encrypted.
    var secret = ListoSync.newSecret(), st = cur.state, oldId = cur.id;
    ListoSync.derive(secret).then(function (keys) {
      store.set(K.list(keys.roomId), st);
      var idx = listIndex(); delete idx[oldId]; store.set(K.index, idx); store.del(K.list(oldId));   // moved, not copied
      return openShared(secret);
    }).then(offerLink);
  }
  function offerLink() {
    var url = location.origin + location.pathname + '#k=' + cur.secret;
    var title = cur.state.meta.title || 'Lista';
    if (navigator.share) {
      navigator.share({ title: title, text: 'Nuestra lista: ' + title, url: url }).catch(function () {});
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(url).then(function () { toast('Enlace copiado. Quien lo tenga puede ver y editar la lista.'); },
        function () { prompt('Copia este enlace:', url); });
    } else { prompt('Copia este enlace:', url); }
    if (isIOS() && !isStandalone()) setTimeout(function () { showInstallHint(false); }, 1500);
  }

  // ---------- small UI pieces ----------
  var snackTimer = null, snackUndo = null;
  function undo(text, fn) {
    $('snack-text').textContent = text;
    snackUndo = fn;
    $('snack-undo').style.display = '';
    $('snack').classList.add('show');
    clearTimeout(snackTimer);
    snackTimer = setTimeout(function () { $('snack').classList.remove('show'); snackUndo = null; }, 8000);
  }
  function toast(text) {
    $('snack-text').textContent = text;
    snackUndo = null; $('snack-undo').style.display = 'none';
    $('snack').classList.add('show');
    clearTimeout(snackTimer);
    snackTimer = setTimeout(function () { $('snack').classList.remove('show'); }, 3500);
  }
  function maybeLongPressHint() {
    if (hints().longpress) return;
    setHint('longpress');
    setTimeout(function () { toast('Consejo: mantén presionado un artículo para editarlo o borrarlo.'); }, 600);
  }
  var isIOS = function () { return /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); };
  var isStandalone = function () { return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; };
  function showHint(text, key) {
    var h = $('hint');
    h.textContent = '';
    h.appendChild(el('div', '', text));
    var ok = el('button', '', 'Entendido');
    ok.onclick = function () { if (key) setHint(key); h.classList.remove('show'); };
    h.appendChild(ok); h.classList.add('show');
  }
  function showInstallHint(force) {
    if (!force && hints().install) return;
    showHint('Para tenerla como app en tu iPhone: en Safari toca Compartir (el cuadro con la flecha; si no lo ves, toca ⋯ junto a la dirección) y elige «Agregar a inicio». Hazlo con esta lista abierta para que el ícono la abra.', 'install');
  }
  var installPrompt = null;
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); installPrompt = e; });

  function focusInput() { var i = $('i1'); try { i.focus({ preventScroll: true }); } catch (e) { i.focus(); } }
  function layout() {
    var h = document.querySelector('header').getBoundingClientRect().height;
    $('main').style.top = h + 'px';
  }

  // ---------- wiring ----------
  function bind() {
    ['i1', 'i2'].forEach(function (id) {
      var inp = $(id);
      inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); addFrom(inp); } });
    });
    var title = $('title'), titleTimer = null;
    title.addEventListener('input', function () {
      cur.state.meta = Object.assign({}, cur.state.meta, { title: (title.textContent.trim() || 'LISTA').slice(0, 120), timestamp: bump(cur.state.meta.timestamp) });
      clearTimeout(titleTimer);
      titleTimer = setTimeout(function () { changed([]); }, 400);
    });
    title.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); title.blur(); focusInput(); } });
    $('btn-share').onclick = share;
    $('btn-menu').onclick = menu;
    $('btn-lists').onclick = listsSheet;
    $('snack-undo').onclick = function () { var f = snackUndo; snackUndo = null; $('snack').classList.remove('show'); if (f) f(); };
    // The empty area below the list is one big "tap to write" target (iPhone needs one tap for the keyboard).
    $('write-zone').addEventListener('click', focusInput);
    $('main').addEventListener('click', function (e) { if (e.target === $('main')) focusInput(); });
    window.addEventListener('hashchange', function () { start(); });
    // After the phone sleeps, always open a fresh connection (sockets die silently in the background).
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState !== 'visible') return;
      if (cur.relay) cur.relay.reconnectNow();
      else if (cur.id) { var st = sanitize(store.get(K.list(cur.id))); if (st) { cur.state = ListoMerge.merge(cur.state, st).state; render(); } }
    });
    window.addEventListener('online', function () { if (cur.relay) cur.relay.reconnectNow(); });
    // Another open copy of the app (tab or installed app) saved this list: merge it in.
    window.addEventListener('storage', function (e) {
      if (!cur.id || e.key !== K.list(cur.id) || !e.newValue) return;
      var st; try { st = sanitize(JSON.parse(e.newValue)); } catch (err) { return; }
      if (!st) return;
      var m = ListoMerge.merge(cur.state, st);
      cur.state = m.state;
      if (m.changed) render();
    });
    window.addEventListener('pagehide', function () { if (cur.id) persist(); });
    window.addEventListener('resize', layout);
  }

  function start() {
    var h = new URLSearchParams(location.hash.replace(/^#/, ''));
    var q = new URLSearchParams(location.search);
    var k = h.get('k'), l = h.get('l');
    if (k && k === cur.secret) return;
    if (l && l === cur.id) return;
    if (k) return openShared(k);
    var old = q.get('room') || q.get('local'), v1 = store.get(K.v1map, {});
    if (old && v1[old]) { history.replaceState(null, '', location.pathname); return openLocal(v1[old]); }
    if (old) { history.replaceState(null, '', location.pathname); setTimeout(function () { toast('Esa lista no está en este teléfono. Pide un enlace nuevo.'); }, 300); }
    if (l && store.get(K.list(l))) return openLocal(l);
    var last = store.get(K.last), e = last && listIndex()[last];
    if (e) return e.secret ? openShared(e.secret) : openLocal(last);
    openLocal('l_' + rid(8));
  }

  migrateV1();
  bind();
  layout();
  start();
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();

</script>
</body>
</html>
