<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<meta name="color-scheme" content="light dark" />
<link rel="canonical" href="https://vdm285.github.io/papelito/" />
<title>Papelito se mudó</title>
<script>
  // Papelito moved to /papelito/. The list's link (#k=…) and ?lang= come along; the fragment
  // never leaves the phone, and lists on this phone were never here: they live on the site.
  location.replace(location.origin + '/papelito/' + location.search + location.hash);
</script>
<style>
  :root { --paper: #fbf8f1; --ink: #23336e; --pencil: #5f5a52; }
  @media (prefers-color-scheme: dark) { :root { --paper: #1d1f24; --ink: #c9d4ff; --pencil: #b4ada2; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--pencil); font: 18px/1.5 system-ui, sans-serif; padding: 0 16px; }
  main { max-width: 32rem; }
  h1 { color: var(--ink); font-size: 1.4rem; margin: 0 0 .4rem; }
  a { color: var(--ink); }
  p { margin: .3rem 0; }
</style>
</head>
<body>
<main>
  <h1>Papelito se mudó</h1>
  <p>Ahora vive en <a href="https://vdm285.github.io/papelito/">vdm285.github.io/papelito</a>. Tus listas siguen en este teléfono.</p>
  <p lang="en">Papelito moved to <a href="https://vdm285.github.io/papelito/">vdm285.github.io/papelito</a>. Your lists are still on this phone.</p>
</main>
</body>
</html>
